<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صروح الثبات | نظام عروض الأسعار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1F4D;
  --navy-2:#132a63;
  --orange:#F97316;
  --orange-2:#fb8c3c;
  --bg:#F3F5F9;
  --card:#ffffff;
  --border:#E3E7EE;
  --text:#1C2333;
  --muted:#7A8296;
  --green:#1E9E5A;
  --red:#E0433A;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select,textarea{font-family:inherit;}

/* ---------- App Shell ---------- */
#topbar{
  background:var(--navy);
  color:#fff;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;top:0;z-index:50;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
#topbar .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;}
#topbar .brand .dot{width:10px;height:10px;background:var(--orange);border-radius:3px;transform:rotate(45deg);}
#topbar nav{display:flex;gap:6px;flex-wrap:wrap;}
#topbar nav button{
  background:transparent;color:#cdd6ea;padding:8px 14px;border-radius:8px;font-weight:700;font-size:14px;transition:.15s;
}
#topbar nav button:hover{background:rgba(255,255,255,.08);color:#fff;}
#topbar nav button.active{background:var(--orange);color:#fff;}

#app{max-width:1180px;margin:0 auto;padding:26px 18px 80px;}

.page-title{font-size:24px;font-weight:900;color:var(--navy);margin:0 0 4px;}
.page-sub{color:var(--muted);font-size:14px;margin:0 0 22px;}

/* ---------- Dashboard cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.doc-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;
  display:flex;flex-direction:column;gap:10px;transition:.15s;cursor:pointer;position:relative;overflow:hidden;
}
.doc-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(11,31,77,.12);border-color:var(--orange);}
.doc-card .icon{width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:var(--orange);display:flex;align-items:center;justify-content:center;font-size:22px;}
.doc-card h3{margin:0;font-size:17px;color:var(--navy);}
.doc-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.6;}
.doc-card .go{position:absolute;left:16px;bottom:16px;color:var(--orange);font-weight:700;font-size:13px;}

.stats-row{display:flex;gap:14px;margin-bottom:24px;flex-wrap:wrap;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 20px;min-width:150px;}
.stat .n{font-size:22px;font-weight:900;color:var(--navy);}
.stat .l{font-size:12px;color:var(--muted);}

/* ---------- Forms ---------- */
.form-wrap{display:grid;grid-template-columns:1.05fr 1.35fr;gap:20px;align-items:start;}
@media(max-width:980px){.form-wrap{grid-template-columns:1fr;}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;}
.panel h4{margin:0 0 14px;color:var(--navy);font-size:15px;font-weight:900;border-bottom:2px solid var(--bg);padding-bottom:10px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fbfcfe;color:var(--text);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--orange);background:#fff;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field textarea{resize:vertical;min-height:56px;}

.items-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px;}
.items-table th{background:var(--navy);color:#fff;padding:8px 6px;font-size:12px;font-weight:700;}
.items-table td{padding:5px 4px;border:1px solid var(--border);}
.items-table td input{border:none;background:transparent;width:100%;padding:6px 4px;font-size:13px;text-align:center;}
.items-table td input:focus{outline:2px solid var(--orange);border-radius:4px;}
.items-table .rm{background:#fde2e1;color:var(--red);border-radius:6px;width:26px;height:26px;font-weight:900;}
.add-row-btn{margin-top:10px;background:#eef1f8;color:var(--navy);padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;}
.add-row-btn:hover{background:#e2e7f4;}

.btn-primary{background:var(--orange);color:#fff;padding:11px 20px;border-radius:9px;font-weight:800;font-size:14.5px;}
.btn-primary:hover{background:var(--orange-2);}
.btn-secondary{background:var(--navy);color:#fff;padding:11px 20px;border-radius:9px;font-weight:800;font-size:14.5px;}
.btn-secondary:hover{background:var(--navy-2);}
.btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--border);padding:10px 18px;border-radius:9px;font-weight:700;font-size:14px;}
.actions-bar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}

/* ---------- Document Preview (also print target) ---------- */
.doc-sheet{
  background:#fff;width:100%;max-width:820px;margin:0 auto;border:1px solid var(--border);border-radius:10px;overflow:hidden;
  box-shadow:0 6px 24px rgba(11,31,77,.08);
}
.doc-header{position:relative;background:#fff;padding:22px 26px 26px;display:flex;justify-content:space-between;align-items:flex-start;overflow:hidden;}
.doc-header::before{content:'';position:absolute;top:0;right:0;bottom:0;width:14px;background:var(--orange);}
.doc-header .company{position:relative;z-index:2;}
.doc-header .company .tag{color:var(--orange);font-weight:700;font-size:12px;margin-bottom:2px;}
.doc-header .company h1{margin:0;color:var(--navy);font-size:21px;font-weight:900;line-height:1.35;}
.doc-header .company h1 span{display:block;font-size:16px;color:var(--orange);}
.doc-header .company .slogan{margin-top:8px;font-size:11.5px;color:var(--muted);border-top:2px solid var(--bg);padding-top:6px;display:inline-block;}
.doc-badge{
  background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:12px;padding:12px 18px;text-align:center;min-width:150px;
}
.doc-badge .t{font-size:13px;color:#cdd6ea;margin-bottom:4px;}
.doc-badge .big{font-size:15px;font-weight:900;color:var(--orange);}
.doc-title-strip{padding:0 26px 14px;}
.doc-title-strip h2{margin:0;font-size:30px;font-weight:900;color:var(--navy);border-bottom:4px solid var(--orange);display:inline-block;padding-bottom:6px;}
.doc-title-strip .subtitle{color:var(--muted);font-size:13px;margin-top:6px;}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 26px 18px;}
.info-box{border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.info-box h5{margin:0 0 8px;color:var(--navy);font-size:12.5px;font-weight:900;}
.info-line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}
.info-line:last-child{border-bottom:none;}
.info-line .k{color:var(--muted);}
.info-line .v{font-weight:700;color:var(--text);max-width:60%;text-align:left;word-break:break-word;}

.doc-table-wrap{padding:0 26px;}
table.doc-table{width:100%;border-collapse:collapse;font-size:12px;}
table.doc-table th{background:var(--navy);color:#fff;padding:8px 5px;font-weight:700;}
table.doc-table td{padding:7px 5px;border:1px solid var(--border);text-align:center;}

.total-bar{margin:16px 26px 0;background:var(--orange);color:#fff;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:900;}
.total-bar .amt{font-size:18px;}

.bank-box{margin:16px 26px 0;border:1.5px solid var(--orange);border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12.5px;}
.bank-box .item{display:flex;flex-direction:column;gap:2px;}
.bank-box .item .k{color:var(--muted);font-size:11px;}
.bank-box .item .v{font-weight:800;color:var(--navy);}

.notes-box{margin:16px 26px 0;font-size:12px;color:var(--muted);}
.notes-box ul{margin:6px 0 0;padding-inline-start:18px;}
.notes-box li{margin-bottom:4px;}

.sign-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 26px 0;font-size:12.5px;}
.sign-grid .sg h5{margin:0 0 10px;color:var(--navy);font-size:12.5px;}
.sign-grid .sl{border-bottom:1px dashed var(--border);padding:7px 0;display:flex;justify-content:space-between;}

.doc-footer{margin-top:22px;background:var(--navy);color:#fff;padding:12px 26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:12px;}
.doc-footer .contact-item{display:flex;align-items:center;gap:6px;}
.doc-footer .quality{background:var(--orange);padding:8px 16px;border-radius:8px;font-weight:800;}

.receipt-amount-box{margin:0 26px 12px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;}
.receipt-amount-box .v{font-weight:900;color:var(--navy);font-size:15px;}
.receipt-words{margin:0 26px 12px;font-size:12px;color:var(--muted);}

/* ---------- Archive ---------- */
.archive-toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.archive-toolbar input{flex:1;min-width:220px;padding:10px 14px;border:1px solid var(--border);border-radius:9px;font-size:14px;}
table.archive-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;}
table.archive-table th{background:var(--navy);color:#fff;padding:11px 10px;font-size:13px;text-align:right;}
table.archive-table td{padding:10px;border-bottom:1px solid var(--border);font-size:13px;}
table.archive-table tr:hover td{background:#f8f9fc;}
.pill{padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.pill.pending{background:#FFF3D6;color:#9A6B00;}
.pill.approved{background:#DFF6E7;color:var(--green);}
.pill.rejected{background:#FDE3E1;color:var(--red);}
.row-actions button{background:none;padding:4px 7px;border-radius:6px;font-size:13px;}
.row-actions button:hover{background:var(--bg);}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .em{font-size:40px;margin-bottom:10px;}

/* ---------- Settings ---------- */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:900px){.settings-grid{grid-template-columns:1fr;}}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:10px;font-weight:700;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.25s;z-index:999;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

/* ---------- Print ---------- */
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute;top:0;right:0;left:0;margin:0;padding:0;}
  .doc-sheet{box-shadow:none;border:none;max-width:100%;}
  @page{size:A4;margin:8mm;}
}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand"><span class="dot"></span> صروح الثبات — نظام العروض</div>
  <nav id="nav">
    <button data-r="dashboard">الرئيسية</button>
    <button data-r="archive">الأرشيف</button>
    <button data-r="settings">الإعدادات</button>
  </nav>
</div>

<div id="app"></div>
<div id="toast"></div>

<script>
/* ============================= DATA LAYER ============================= */
const DEFAULT_SETTINGS = {
  companyLine1:'صروح الثبات',
  companyLine2:'لمواد البناء',
  slogan:'جَودة تُبنَى عليها الثقة',
  taxNumber:'314629964600003',
  address:'الرياض - المملكة العربية السعودية',
  phone:'050 834 6559',
  email:'sales@suroohgroup.com',
  website:'www.suroohgroup.com',
  bankName:'مصرف الراجحي - alrajhi bank',
  accountNumber:'660000010006089725820',
  iban:'SA4480000660608019725820',
  year:'2026',
  startNumber:1,
  nextNumber:1
};

function loadSettings(){
  try{
    const raw = localStorage.getItem('sthabat_settings');
    if(raw) return {...DEFAULT_SETTINGS, ...JSON.parse(raw)};
  }catch(e){}
  return {...DEFAULT_SETTINGS};
}
function saveSettings(s){
  localStorage.setItem('sthabat_settings', JSON.stringify(s));
}
function loadDocs(){
  try{
    const raw = localStorage.getItem('sthabat_documents');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}
function saveDocs(list){
  localStorage.setItem('sthabat_documents', JSON.stringify(list));
}

let SETTINGS = loadSettings();
let DOCS = loadDocs();

function nextDocNumber(){
  const n = SETTINGS.nextNumber || SETTINGS.startNumber || 1;
  return 'Q-' + SETTINGS.year + '-' + String(n).padStart(3,'0');
}
function commitDocNumber(){
  SETTINGS.nextNumber = (SETTINGS.nextNumber || SETTINGS.startNumber || 1) + 1;
  saveSettings(SETTINGS);
}

function uid(){ return 'd' + Date.now() + Math.random().toString(36).slice(2,7); }
function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('en-GB');
}
function money(n){
  n = Number(n)||0;
  return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* Arabic number to words (Saudi Riyal) - supports up to millions */
function numberToArabicWords(num){
  num = Math.floor(Number(num)||0);
  if(num===0) return 'صفر ريال سعودي فقط لا غير';
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة',
  'أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','عشرة','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hundreds=['','مائة','مئتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  function threeDigits(n){
    let str='';
    const h=Math.floor(n/100), r=n%100;
    if(h>0) str+=hundreds[h];
    if(r>0){
      if(str) str+=' و';
      if(r<20) str+=ones[r];
      else{
        const t=Math.floor(r/10), o=r%10;
        str += (o>0? ones[o]+' و':'') + tens[t];
      }
    }
    return str;
  }
  function group(n, singular, dual, plural){
    if(n===0) return '';
    if(n===1) return singular;
    if(n===2) return dual;
    if(n>=3 && n<=10) return threeDigits(n)+' '+plural;
    return threeDigits(n)+' '+singular;
  }
  const million=Math.floor(num/1000000);
  const thousand=Math.floor((num%1000000)/1000);
  const rest=num%1000;
  let parts=[];
  if(million>0) parts.push(group(million,'مليون','مليونان','ملايين'));
  if(thousand>0) parts.push(group(thousand,'ألف','ألفان','آلاف'));
  if(rest>0) parts.push(threeDigits(rest));
  let result = parts.filter(Boolean).join(' و');
  return (result||'صفر') + ' ريال سعودي فقط لا غير';
}

/* ============================= DOCUMENT TYPES ============================= */
const TYPES = {
  concrete:{key:'concrete', title:'عرض سعر خرسانة جاهزة', badge:'خرسانة جاهزة', itemLabel:'نوع الخرسانة', icon:'🚛',
    desc:'خرسانة جاهزة بمقاومات وأنواع أسمنت مختلفة (SRC / OPC)', kind:'quote'},
  interlock:{key:'interlock', title:'عرض سعر إنتر لوك', badge:'إنتر لوك', itemLabel:'الوصف', icon:'🧱',
    desc:'أشكال إنتر لوك (S، I، سداسي، مستطيل، هولندي، متعرج)', kind:'quote', simpleTable:true, terms:true},
  block:{key:'block', title:'عرض سعر بلوك', badge:'بلوك', itemLabel:'نوع البلوك', icon:'🟫',
    desc:'بلوك عادي وعازل بمقاسات مختلفة، السعر لكل 1000 حبة', kind:'quote', simpleTable:true, terms:true, priceUnitNote:'لكل 1000 حبة'},
  general:{key:'general', title:'عرض سعر مواد بناء', badge:'مواد بناء عامة', itemLabel:'البيان', icon:'🏗️',
    desc:'حديد، رمل، أسمنت، أخشاب وجميع مواد البناء', kind:'quote'},
  claim:{key:'claim', title:'مطالبة مالية', badge:'مطالبة مالية', itemLabel:'البيان', icon:'📄',
    desc:'نفس قالب عرض السعر بعنوان مطالبة مالية', kind:'quote'},
  receipt:{key:'receipt', title:'سند استلام', badge:'سند استلام', itemLabel:'', icon:'🧾',
    desc:'إيصال قبض مبلغ من عميل مع بيانات السداد والتوقيعات', kind:'receipt'}
};

/* ============================= ROUTER ============================= */
function go(route){ location.hash = route; }
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', ()=>{ if(!location.hash) location.hash='#/dashboard'; render(); });

function render(){
  const hash = location.hash.replace('#/','') || 'dashboard';
  const parts = hash.split('/');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));
  const app = document.getElementById('app');

  if(parts[0]==='dashboard'){ setActive('dashboard'); app.innerHTML = renderDashboard(); bindDashboard(); }
  else if(parts[0]==='archive'){ setActive('archive'); app.innerHTML = renderArchive(); bindArchive(); }
  else if(parts[0]==='settings'){ setActive('settings'); app.innerHTML = renderSettings(); bindSettings(); }
  else if(parts[0]==='form'){ app.innerHTML = renderForm(parts[1], parts[2]); bindForm(parts[1], parts[2]); }
  else if(parts[0]==='view'){ app.innerHTML = renderViewPage(parts[1]); bindViewPage(parts[1]); }
  else { app.innerHTML = renderDashboard(); bindDashboard(); }
  window.scrollTo(0,0);
}
function setActive(name){
  const btn = document.querySelector('#nav button[data-r="'+name+'"]');
  if(btn) btn.classList.add('active');
}
document.getElementById('nav').addEventListener('click', e=>{
  const b = e.target.closest('button[data-r]');
  if(b) go('#/'+b.dataset.r);
});

/* ============================= DASHBOARD ============================= */
function renderDashboard(){
  const total = DOCS.length;
  const quotes = DOCS.filter(d=>TYPES[d.type].kind==='quote').length;
  const receipts = DOCS.filter(d=>TYPES[d.type].kind==='receipt').length;
  const cards = Object.values(TYPES).map(t=>`
    <div class="doc-card" data-new="${t.key}">
      <div class="icon">${t.icon}</div>
      <h3>${t.title}</h3>
      <p>${t.desc}</p>
      <span class="go">إنشاء جديد ←</span>
    </div>
  `).join('');
  return `
    <h1 class="page-title">أهلاً بك 👋</h1>
    <p class="page-sub">اختر نوع المستند اللي عايز تنشئه. الرقم التالي المتاح: <b style="color:var(--navy)">${nextDocNumber()}</b></p>
    <div class="stats-row">
      <div class="stat"><div class="n">${total}</div><div class="l">إجمالي المستندات المحفوظة</div></div>
      <div class="stat"><div class="n">${quotes}</div><div class="l">عروض أسعار / مطالبات</div></div>
      <div class="stat"><div class="n">${receipts}</div><div class="l">سندات استلام</div></div>
    </div>
    <div class="grid">${cards}</div>
  `;
}
function bindDashboard(){
  document.querySelectorAll('.doc-card').forEach(c=>{
    c.addEventListener('click', ()=> go('#/form/'+c.dataset.new+'/new'));
  });
}

/* ============================= FORM (create/edit) ============================= */
function blankDoc(type){
  const t = TYPES[type];
  const base = {
    id: uid(), type, number: nextDocNumber(), createdAt: Date.now(), status:'pending',
    date: todayStr()
  };
  if(t.kind==='quote'){
    return {...base,
      customerName:'', contact:'', taxNumberClient:'', paymentMethod:'', location:'',
      project:'', materialType:'', taxPercent:15, workDescription:'', preparedBy:'', location2:'',
      priceTerms:'', deliveryTerms:'',
      items:[ emptyItem() ]
    };
  } else {
    return {...base,
      receivedFrom:'', amount:'', amountFor:'', paymentMethod:'تحويل بنكي', txnRef:'', bankName:'',
      notes:'', receiverName:'', receiverDate: todayStr(), payerName:'', payerDate: todayStr()
    };
  }
}
function emptyItem(){ return {id:uid(), desc:'', unit:'', qty:1, price:0}; }

function getDoc(type, id){
  if(id==='new') return blankDoc(type);
  return DOCS.find(d=>d.id===id) || blankDoc(type);
}

function renderForm(type, id){
  const t = TYPES[type];
  if(!t) return '<p>نوع غير معروف</p>';
  const doc = getDoc(type, id);
  window._currentDoc = JSON.parse(JSON.stringify(doc));

  return `
    <h1 class="page-title">${t.title}</h1>
    <p class="page-sub">رقم المستند: <b style="color:var(--orange)">${doc.number}</b> — ${id==='new'?'مستند جديد':'تعديل مستند محفوظ'}</p>
    <div class="form-wrap">
      <div id="form-panels">${ t.kind==='quote' ? quoteFormPanels(t, window._currentDoc) : receiptFormPanels(window._currentDoc) }</div>
      <div>
        <div class="panel" style="padding:14px;">
          <h4>معاينة حية</h4>
          <div id="preview">${ t.kind==='quote' ? quotePreview(t, window._currentDoc) : receiptPreview(window._currentDoc) }</div>
        </div>
      </div>
    </div>
  `;
}

  return `<tr data-id="${it.id}">
    <td>${i+1}</td>
    <td><input data-if="desc" value="${it.desc||''}" style="text-align:right;"></td>
    <td><input data-if="unit" value="${it.unit||''}"></td>

    <td style="font-weight:800;color:var(--navy);">${money(total)}</td>

function computeTotals(doc){
  let subtotal=0, vat=0;
  doc.items.forEach(it=>{
    const base = (Number(it.qty)||0)*(Number(it.price)||0);
    subtotal += base;
    vat += base*((doc.taxPercent||15)/100);
  });
  return {subtotal, vat, grand: subtotal+vat};
}

/* ---- form bindings ---- */
function bindForm(type, id){
  const t = TYPES[type];
  const doc = window._currentDoc;

  function refreshPreview(){
    document.getElementById('preview').innerHTML = t.kind==='quote' ? quotePreview(t, doc) : receiptPreview(doc);
  }
  document.getElementById('form-panels').addEventListener('input', e=>{
    const f = e.target.dataset.f;
    if(f){ doc[f] = e.target.value; refreshPreview(); return; }
    const ifld = e.target.dataset.if;
    if(ifld){
      const tr = e.target.closest('tr');
      const itemId = tr.dataset.id;
      const item = doc.items.find(x=>x.id===itemId);
      item[ifld] = ifld==='qty'||ifld==='price' ? Number(e.target.value) : e.target.value;
      // re-render just the row's computed cells without losing focus: rebuild whole tbody is fine since simple
      refreshPreview();
      updateRowComputed(tr, item, doc.taxPercent);
    }
  });
  document.getElementById('form-panels').addEventListener('click', e=>{
    if(e.target.id==='add-row'){
      doc.items.push(emptyItem());
      document.getElementById('items-body').innerHTML = doc.items.map((it,i)=>itemRow(it,i)).join('');
      refreshPreview();
    }
    const rmId = e.target.dataset.rm;
    if(rmId){
      doc.items = doc.items.filter(x=>x.id!==rmId);
      if(doc.items.length===0) doc.items.push(emptyItem());
      document.getElementById('items-body').innerHTML = doc.items.map((it,i)=>itemRow(it,i)).join('');
      refreshPreview();
    }
    if(e.target.id==='save-doc'){ persistDoc(doc); toast('✅ تم الحفظ في الأرشيف'); go('#/archive'); }
    if(e.target.id==='save-print'){ persistDoc(doc); toast('✅ تم الحفظ'); setTimeout(()=>go('#/view/'+doc.id+'?print=1'),150); }
    if(e.target.id==='cancel-form'){ go('#/dashboard'); }
  });
}
function updateRowComputed(tr, item, taxPercent){
  const base = (Number(item.qty)||0)*(Number(item.price)||0);
  const vat = base*((taxPercent||15)/100);
  const cells = tr.querySelectorAll('td');
  cells[5].textContent = money(vat);
  cells[6].textContent = money(base+vat);
}
function persistDoc(doc){
  const isNew = !DOCS.find(d=>d.id===doc.id);
  if(isNew){
    commitDocNumber();
    DOCS.unshift(doc);
  } else {
    DOCS = DOCS.map(d=> d.id===doc.id ? doc : d);
  }
  saveDocs(DOCS);
}

/* ============================= VIEW / PRINT PAGE ============================= */
function renderViewPage(id){
  const doc = DOCS.find(d=>d.id===id);
  if(!doc) return '<p>المستند غير موجود</p>';
  const t = TYPES[doc.type];
  const html = t.kind==='quote' ? quotePreview(t, doc) : receiptPreview(doc);
  return `
    <div class="actions-bar" style="margin-bottom:16px;">
      <button class="btn-secondary" id="do-print">🖨️ طباعة / تنزيل PDF</button>
      <button class="btn-ghost" id="do-edit">✏️ تعديل</button>
      <button class="btn-ghost" id="do-duplicate">🧾 نسخ كمستند جديد</button>
      <button class="btn-ghost" id="back-archive">↩ رجوع للأرشيف</button>
    </div>
    <div id="print-area">${html}</div>
  `;
}
function bindViewPage(id){
  const doc = DOCS.find(d=>d.id===id);
  document.getElementById('do-print').addEventListener('click', ()=>window.print());
  document.getElementById('do-edit').addEventListener('click', ()=>go('#/form/'+doc.type+'/'+doc.id));
  document.getElementById('do-duplicate').addEventListener('click', ()=>{
    const copy = JSON.parse(JSON.stringify(doc));
    copy.id = uid(); copy.number = nextDocNumber(); copy.date = todayStr(); copy.status='pending';
    commitDocNumber(); DOCS.unshift(copy); saveDocs(DOCS);
    toast('✅ تم إنشاء نسخة جديدة برقم '+copy.number);
    go('#/form/'+copy.type+'/'+copy.id);
  });
  document.getElementById('back-archive').addEventListener('click', ()=>go('#/archive'));
  if(location.hash.includes('print=1')) setTimeout(()=>window.print(), 300);
}

/* ============================= ARCHIVE ============================= */
function renderArchive(){
  if(DOCS.length===0){
    return `
      <h1 class="page-title">الأرشيف</h1>
      <p class="page-sub">كل عروض الأسعار والسندات المحفوظة هتظهر هنا</p>
      <div class="empty-state"><div class="em">🗂️</div>لسه مفيش مستندات محفوظة.<br>روح للرئيسية وأنشئ أول عرض سعر.</div>
    `;
  }
  return `
    <h1 class="page-title">الأرشيف</h1>
    <p class="page-sub">${DOCS.length} مستند محفوظ</p>
    <div class="archive-toolbar">
      <input id="search" placeholder="ابحث بالاسم، الرقم، أو نوع المستند...">
      <select id="filter-type">
        <option value="">كل الأنواع</option>
        ${Object.values(TYPES).map(t=>`<option value="${t.key}">${t.title}</option>`).join('')}
      </select>
    </div>
    <table class="archive-table">
      <thead><tr><th>رقم المستند</th><th>النوع</th><th>العميل / الجهة</th><th>التاريخ</th><th>الحالة</th><th>الإجمالي</th><th></th></tr></thead>
      <tbody id="archive-body">${archiveRows(DOCS)}</tbody>
    </table>
  `;
}
function archiveRows(list){
  return list.map(d=>{
    const t = TYPES[d.type];
    const name = t.kind==='quote' ? (d.customerName||'—') : (d.receivedFrom||'—');
    const total = t.kind==='quote' ? money(computeTotals(d).grand) : money(d.amount);
    return `<tr>
      <td><b>${d.number}</b></td>
      <td>${t.title}</td>
      <td>${name}</td>
      <td>${d.date}</td>
      <td>${statusPill(d)}</td>
      <td>${total} ريال</td>
      <td class="row-actions">
        <button data-view="${d.id}" title="عرض">👁️</button>
        <button data-edit="${d.id}" data-type="${d.type}" title="تعديل">✏️</button>
        <button data-del="${d.id}" title="حذف">🗑️</button>
      </td>
    </tr>`;
  }).join('');
}
function statusPill(d){
  if(TYPES[d.type].kind!=='quote') return '<span class="pill approved">مكتمل</span>';
  const map = {pending:['قيد الانتظار','pending'], approved:['تمت الموافقة','approved'], rejected:['مرفوض','rejected']};
  const [label,cls] = map[d.status||'pending'];
  return `<select class="pill ${cls}" data-status="${d.id}" style="border:none;background:transparent;font-weight:700;">
    ${Object.entries(map).map(([k,v])=>`<option value="${k}" ${d.status===k?'selected':''}>${v[0]}</option>`).join('')}
  </select>`;
}
function bindArchive(){
  document.getElementById('search').addEventListener('input', filterArchive);
  document.getElementById('filter-type').addEventListener('change', filterArchive);
  function filterArchive(){
    const q = document.getElementById('search').value.trim().toLowerCase();
    const ty = document.getElementById('filter-type').value;
    const filtered = DOCS.filter(d=>{
      const t = TYPES[d.type];
      const name = t.kind==='quote' ? (d.customerName||'') : (d.receivedFrom||'');
      const matchQ = !q || d.number.toLowerCase().includes(q) || name.toLowerCase().includes(q) || t.title.toLowerCase().includes(q);
      const matchT = !ty || d.type===ty;
      return matchQ && matchT;
    });
    document.getElementById('archive-body').innerHTML = archiveRows(filtered);
    bindArchiveRowActions();
  }
  bindArchiveRowActions();
}
function bindArchiveRowActions(){
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go('#/view/'+b.dataset.view));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>go('#/form/'+b.dataset.type+'/'+b.dataset.edit));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(confirm('تأكيد حذف هذا المستند نهائياً؟')){
      DOCS = DOCS.filter(d=>d.id!==b.dataset.del);
      saveDocs(DOCS);
      toast('🗑️ تم الحذف');
      render();
    }
  });
  document.querySelectorAll('[data-status]').forEach(sel=>sel.onchange=(e)=>{
    const d = DOCS.find(x=>x.id===sel.dataset.status);
    d.status = e.target.value;
    saveDocs(DOCS);
    toast('تم تحديث الحالة');
  });
}

/* ============================= SETTINGS ============================= */
function renderSettings(){
  const s = SETTINGS;
  return `
    <h1 class="page-title">الإعدادات</h1>
    <p class="page-sub">هذه البيانات ثابتة وهتظهر أوتوماتيك في كل عرض/سند تعمله</p>
    <div class="settings-grid">
      <div class="panel">
        <h4>بيانات الشركة</h4>
        <div class="field"><label>اسم الشركة (سطر 1)</label><input id="s-companyLine1" value="${s.companyLine1}"></div>
        <div class="field"><label>اسم الشركة (سطر 2)</label><input id="s-companyLine2" value="${s.companyLine2}"></div>
        <div class="field"><label>الشعار</label><input id="s-slogan" value="${s.slogan}"></div>
        <div class="field"><label>الرقم الضريبي</label><input id="s-taxNumber" value="${s.taxNumber}"></div>
        <div class="field"><label>العنوان</label><input id="s-address" value="${s.address}"></div>
      </div>
      <div class="panel">
        <h4>بيانات التواصل</h4>
        <div class="field"><label>الهاتف / واتساب</label><input id="s-phone" value="${s.phone}"></div>
        <div class="field"><label>البريد الإلكتروني</label><input id="s-email" value="${s.email}"></div>
        <div class="field"><label>الموقع الإلكتروني</label><input id="s-website" value="${s.website}"></div>
      </div>
      <div class="panel">
        <h4>البيانات البنكية</h4>
        <div class="field"><label>اسم البنك</label><input id="s-bankName" value="${s.bankName}"></div>
        <div class="field"><label>رقم الحساب</label><input id="s-accountNumber" value="${s.accountNumber}"></div>
        <div class="field"><label>رقم الآيبان</label><input id="s-iban" value="${s.iban}"></div>
      </div>
      <div class="panel">
        <h4>ترقيم المستندات</h4>
        <div class="field"><label>سنة الترقيم</label><input id="s-year" value="${s.year}"></div>
        <div class="field"><label>الرقم التالي (Q-${s.year}-XXX)</label><input id="s-nextNumber" type="number" value="${s.nextNumber}"></div>
        <p style="font-size:12px;color:var(--muted);">كل مستند جديد هياخد هذا الرقم ثم يزيد تلقائياً بواحد.</p>
      </div>
    </div>
    <div class="actions-bar">
      <button class="btn-primary" id="save-settings">💾 حفظ الإعدادات</button>
    </div>
  `;
}
function bindSettings(){
  document.getElementById('save-settings').addEventListener('click', ()=>{
    SETTINGS = {
      ...SETTINGS,
      companyLine1: val('s-companyLine1'), companyLine2: val('s-companyLine2'), slogan: val('s-slogan'),
      taxNumber: val('s-taxNumber'), address: val('s-address'),
      phone: val('s-phone'), email: val('s-email'), website: val('s-website'),
      bankName: val('s-bankName'), accountNumber: val('s-accountNumber'), iban: val('s-iban'),
      year: val('s-year'), nextNumber: Number(val('s-nextNumber'))
    };
    saveSettings(SETTINGS);
    toast('✅ تم حفظ الإعدادات');
  });
  function val(id){ return document.getElementById(id).value; }
}
</script>
</body>
</html>

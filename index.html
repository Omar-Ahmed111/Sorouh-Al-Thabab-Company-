<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صروح الثبات | نظام عروض الأسعار</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --navy: #0B1F4D;
      --navy-2: #132a63;
      --orange: #F97316;
      --orange-2: #fb8c3c;
      --bg: #F3F5F9;
      --card: #ffffff;
      --border: #E3E7EE;
      --text: #1C2333;
      --muted: #7A8296;
      --green: #1E9E5A;
      --red: #E0433A;
      --bank-blue: #003366;
      --whatsapp: #25D366;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; }
    input, select, textarea { font-family: inherit; }

    #topbar { background: var(--navy); color: #fff; padding: 14px 22px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 10px rgba(0, 0, 0, .15); }
    #topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 18px; }
    #topbar .brand .dot { width: 10px; height: 10px; background: var(--orange); border-radius: 3px; transform: rotate(45deg); }
    #topbar nav { display: flex; gap: 6px; flex-wrap: wrap; }
    #topbar nav button { background: transparent; color: #cdd6ea; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 14px; transition: .15s; }
    #topbar nav button:hover { background: rgba(255, 255, 255, .08); color: #fff; }
    #topbar nav button.active { background: var(--orange); color: #fff; }

    #app { max-width: 1180px; margin: 0 auto; padding: 26px 18px 80px; }
    .page-title { font-size: 24px; font-weight: 900; color: var(--navy); margin: 0 0 4px; }
    .page-sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .doc-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px; transition: .15s; cursor: pointer; position: relative; overflow: hidden; }
    .doc-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(11, 31, 77, .12); border-color: var(--orange); }
    .doc-card .icon { width: 46px; height: 46px; border-radius: 10px; background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: var(--orange); display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .doc-card h3 { margin: 0; font-size: 17px; color: var(--navy); }
    .doc-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .doc-card .go { position: absolute; left: 16px; bottom: 16px; color: var(--orange); font-weight: 700; font-size: 13px; }

    .stats-row { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 20px; min-width: 150px; }
    .stat .n { font-size: 22px; font-weight: 900; color: var(--navy); }
    .stat .l { font-size: 12px; color: var(--muted); }

    .form-wrap { display: grid; grid-template-columns: 1.05fr 1.35fr; gap: 20px; align-items: start; }
    @media(max-width:980px) { .form-wrap { grid-template-columns: 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
    .panel h4 { margin: 0 0 14px; color: var(--navy); font-size: 15px; font-weight: 900; border-bottom: 2px solid var(--bg); padding-bottom: 10px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    .field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #fbfcfe; color: var(--text); }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--orange); background: #fff; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field textarea { resize: vertical; min-height: 56px; }

    .items-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
    .items-table th { background: var(--navy); color: #fff; padding: 8px 6px; font-size: 12px; font-weight: 700; }
    .items-table td { padding: 5px 4px; border: 1px solid var(--border); }
    .items-table td input { border: none; background: transparent; width: 100%; padding: 6px 4px; font-size: 13px; text-align: center; }
    .items-table td input:focus { outline: 2px solid var(--orange); border-radius: 4px; }
    .items-table .rm { background: #fde2e1; color: var(--red); border-radius: 6px; width: 26px; height: 26px; font-weight: 900; }
    .add-row-btn { margin-top: 10px; background: #eef1f8; color: var(--navy); padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 13px; }
    .add-row-btn:hover { background: #e2e7f4; }

    .btn-primary { background: var(--orange); color: #fff; padding: 11px 20px; border-radius: 9px; font-weight: 800; font-size: 14.5px; }
    .btn-primary:hover { background: var(--orange-2); }
    .btn-secondary { background: var(--navy); color: #fff; padding: 11px 20px; border-radius: 9px; font-weight: 800; font-size: 14.5px; }
    .btn-secondary:hover { background: var(--navy-2); }
    .btn-pdf { background: #b91c1c; color: #fff; padding: 11px 20px; border-radius: 9px; font-weight: 800; font-size: 14.5px; }
    .btn-pdf:hover { background: #991b1b; }
    .btn-ghost { background: #fff; color: var(--navy); border: 1px solid var(--border); padding: 10px 18px; border-radius: 9px; font-weight: 700; font-size: 14px; }
    .btn-whatsapp { background: var(--whatsapp); color: #fff; padding: 11px 20px; border-radius: 9px; font-weight: 800; font-size: 14.5px; display: inline-flex; align-items: center; gap: 6px; }
    .btn-whatsapp:hover { background: #1da851; }
    .btn-whatsapp.disabled { background: #ccc; color: #666; cursor: not-allowed; }
    .btn-whatsapp.disabled:hover { background: #ccc; }
    .btn-toggle-total { background: var(--navy); color: #fff; padding: 11px 20px; border-radius: 9px; font-weight: 800; font-size: 14.5px; display: inline-flex; align-items: center; gap: 6px; }
    .btn-toggle-total:hover { background: var(--navy-2); }
    .btn-toggle-total.showing { background: var(--orange); }
    .btn-toggle-total.showing:hover { background: var(--orange-2); }
    .btn-toggle-number { background: var(--navy); color: #fff; padding: 11px 20px; border-radius: 9px; font-weight: 800; font-size: 14.5px; display: inline-flex; align-items: center; gap: 6px; }
    .btn-toggle-number:hover { background: var(--navy-2); }
    .btn-toggle-number.showing { background: var(--orange); }
    .btn-toggle-number.showing:hover { background: var(--orange-2); }

    .actions-bar { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

    .doc-sheet { 
      background: #fff; 
      width: 100%; 
      max-width: 850px; 
      margin: 0 auto; 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      overflow: hidden; 
      box-shadow: 0 6px 24px rgba(11, 31, 77, .08); 
      position: relative;
    }

    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.10;
      pointer-events: none;
      z-index: 10;
      width: 80%;
      max-width: 700px;
      height: auto;
    }
    .watermark img {
      width: 100%;
      height: auto;
      display: block;
    }

    .doc-header { background: #fff; padding: 18px 26px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; gap: 20px; position: relative; z-index: 2; }
    .doc-header .logo-area { flex-shrink: 0; }
    .doc-header .logo-area .logo-img { height: 120px; width: auto; border-radius: 10px; object-fit: contain; background: #fff; padding: 5px; border: 1px solid #ddd; display: block; }
    .doc-header .badge-area { flex-shrink: 0; }
    .doc-header .badge-area .doc-badge { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; border-radius: 12px; padding: 14px 22px; text-align: center; min-width: 160px; border: 2px solid var(--orange); box-shadow: 0 2px 10px rgba(0, 0, 0, .12); }
    .doc-header .badge-area .doc-badge .t { font-size: 14px; color: #cdd6ea; margin-bottom: 3px; }
    .doc-header .badge-area .doc-badge .big { font-size: 24px; font-weight: 900; color: var(--orange); }
    .doc-header .company-info { flex: 1; text-align: center; padding: 0 15px; }
    .doc-header .company-info .tag { color: var(--orange); font-weight: 700; font-size: 14px; margin-bottom: 2px; }
    .doc-header .company-info h1 { margin: 0; color: var(--navy); font-size: 26px; font-weight: 900; line-height: 1.3; }
    .doc-header .company-info h1 span { font-size: 18px; color: var(--orange); display: block; margin-top: 2px; }
    .doc-header .company-info .slogan { font-size: 14px; color: var(--muted); border-top: 2px solid #f0f0f0; padding-top: 5px; margin-top: 4px; }

    .doc-title-strip { padding: 0 26px 12px; border-bottom: 1px solid #eee; position: relative; z-index: 2; }
    .doc-title-strip h2 { margin: 10px 0 2px; font-size: 30px; font-weight: 900; color: var(--navy); border-bottom: 4px solid var(--orange); display: inline-block; padding-bottom: 4px; }
    .doc-title-strip .subtitle { color: var(--muted); font-size: 15px; margin-top: 2px; }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px 26px 12px; position: relative; z-index: 2; }
    .info-box { border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
    .info-box h5 { margin: 0 0 8px; color: var(--navy); font-size: 14px; font-weight: 900; }
    .info-line { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
    .info-line:last-child { border-bottom: none; }
    .info-line .k { color: var(--muted); font-weight: 500; }
    .info-line .v { font-weight: 800; color: var(--text); max-width: 60%; text-align: left; word-break: break-word; }
    .info-line .v.green-static { color: var(--green) !important; }

    .doc-table-wrap { padding: 0 26px 8px; position: relative; z-index: 2; }
    table.doc-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.doc-table th { background: var(--navy); color: #fff; padding: 10px 6px; font-weight: 900; }
    table.doc-table td { padding: 9px 6px; border: 1px solid var(--border); text-align: center; font-weight: 500; }

    .total-bar { margin: 12px 26px 0; background: var(--orange); color: #fff; border-radius: 8px; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; position: relative; z-index: 2; }
    .total-bar .amt { font-size: 20px; }
    .total-bar.hidden { display: none; }

    .bank-box { margin: 14px 26px 0; border: 1.5px solid var(--orange); border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 13px; align-items: center; background: #fff; position: relative; z-index: 2; }
    .bank-box .item { display: flex; flex-direction: column; gap: 2px; }
    .bank-box .item .k { color: var(--muted); font-size: 11px; }
    .bank-logo-wrapper { display: flex; align-items: center; gap: 10px; }
    .bank-logo-img { height: 50px; width: auto; object-fit: contain; }
    .bank-name-wrapper { display: flex; flex-direction: column; line-height: 1.2; }
    .bank-name-ar { font-size: 16px; font-weight: 900; color: var(--bank-blue); }
    .bank-name-en { font-size: 12px; font-weight: 600; color: var(--bank-blue); letter-spacing: 0.5px; }
    .bank-box .item .v { font-weight: 900; color: var(--navy); }

    .notes-box { margin: 14px 26px 0; font-size: 13px; color: var(--muted); padding-bottom: 4px; position: relative; z-index: 2; }
    .notes-box ul { margin: 4px 0 0; padding-inline-start: 18px; }
    .notes-box li { margin-bottom: 3px; }
    .notes-box b { color: var(--navy); font-weight: 900; }

    .sign-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 18px 26px 0; font-size: 14px; position: relative; z-index: 2; }
    .sign-grid .sg h5 { margin: 0 0 8px; color: var(--navy); font-size: 14px; font-weight: 900; }
    .sign-grid .sl { border-bottom: 1px dashed var(--border); padding: 6px 0; display: flex; justify-content: space-between; font-weight: 500; }

    .doc-footer { margin-top: 20px; background: var(--navy); color: #fff; padding: 12px 26px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 14px; position: relative; z-index: 2; }
    .doc-footer .contact-item { display: flex; align-items: center; gap: 5px; }
    .doc-footer .quality { background: var(--orange); padding: 6px 16px; border-radius: 8px; font-weight: 900; }

    .receipt-amount-box { margin: 0 26px 12px; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; }
    .receipt-amount-box .v { font-weight: 900; color: var(--navy); font-size: 17px; }
    .receipt-words { margin: 0 26px 12px; font-size: 14px; color: var(--muted); position: relative; z-index: 2; }

    .archive-toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .archive-toolbar input { flex: 1; min-width: 220px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; }
    table.archive-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
    table.archive-table th { background: var(--navy); color: #fff; padding: 11px 10px; font-size: 13px; text-align: right; }
    table.archive-table td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
    table.archive-table tr:hover td { background: #f8f9fc; }
    .pill { padding: 4px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 700; }
    .pill.pending { background: #FFF3D6; color: #9A6B00; }
    .pill.approved { background: #DFF6E7; color: var(--green); }
    .pill.rejected { background: #FDE3E1; color: var(--red); }
    .row-actions button { background: none; padding: 4px 7px; border-radius: 6px; font-size: 13px; }
    .row-actions button:hover { background: var(--bg); }
    .row-actions .btn-whatsapp-small { background: var(--whatsapp); color: #fff; border-radius: 6px; padding: 4px 8px; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
    .row-actions .btn-whatsapp-small:hover { background: #1da851; }
    .row-actions .btn-whatsapp-small.disabled { background: #ccc; color: #666; cursor: not-allowed; }
    .row-actions .btn-whatsapp-small.disabled:hover { background: #ccc; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .em { font-size: 40px; margin-bottom: 10px; }

    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media(max-width:900px) { .settings-grid { grid-template-columns: 1fr; } }

    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 22px; border-radius: 10px; font-weight: 700; font-size: 14px; box-shadow: 0 8px 20px rgba(0, 0, 0, .2); opacity: 0; pointer-events: none; transition: .25s; z-index: 999; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

    .loading-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; gap: 16px; }
    .loading-spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--orange); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #preview .doc-sheet, #print-area .doc-sheet { color: #000 !important; background: #fff !important; }
    #preview .doc-sheet *, #print-area .doc-sheet * { color: #000 !important; border-color: #aaa !important; }
    #preview .doc-sheet .muted, #print-area .doc-sheet .muted { color: #222 !important; }
    #preview .doc-sheet .total-bar, #print-area .doc-sheet .total-bar { background: #F97316 !important; color: #fff !important; }
    #preview .doc-sheet .total-bar *, #print-area .doc-sheet .total-bar * { color: #fff !important; }
    #preview .doc-sheet .total-bar.hidden, #print-area .doc-sheet .total-bar.hidden { display: none !important; }
    #preview .doc-sheet .doc-badge, #print-area .doc-sheet .doc-badge { background: linear-gradient(135deg, #0B1F4D, #132a63) !important; border-color: #F97316 !important; }
    #preview .doc-sheet .doc-badge *, #print-area .doc-sheet .doc-badge * { color: #fff !important; }
    #preview .doc-sheet .doc-badge .big, #print-area .doc-sheet .doc-badge .big { color: #F97316 !important; }
    #preview .doc-sheet .info-line .k, #print-area .doc-sheet .info-line .k { color: #333 !important; }
    #preview .doc-sheet .info-line .v, #print-area .doc-sheet .info-line .v { color: #000 !important; }
    #preview .doc-sheet .doc-header, #print-area .doc-sheet .doc-header { border-bottom: 2px solid #aaa !important; }
    #preview .doc-sheet .doc-title-strip, #print-area .doc-sheet .doc-title-strip { border-bottom: 1px solid #aaa !important; }
    #preview .doc-sheet .logo-img, #print-area .doc-sheet .logo-img { height: 120px !important; width: auto !important; border-color: #aaa !important; }
    #preview .doc-sheet table.doc-table td, #print-area .doc-sheet table.doc-table td { color: #000 !important; font-weight: 600 !important; }
    #preview .doc-sheet table.doc-table th, #print-area .doc-sheet table.doc-table th { background: #0B1F4D !important; color: #fff !important; }
    #preview .doc-sheet .company-info .slogan, #print-area .doc-sheet .company-info .slogan { border-top-color: #aaa !important; }
    #preview .doc-sheet .company-info h1, #print-area .doc-sheet .company-info h1 { line-height: 1.4 !important; }
    #preview .doc-sheet .info-line .v.green-static, #print-area .doc-sheet .info-line .v.green-static { color: #1E9E5A !important; }
    #preview .doc-sheet .bank-name-ar, #print-area .doc-sheet .bank-name-ar,
    #preview .doc-sheet .bank-name-en, #print-area .doc-sheet .bank-name-en { color: #003366 !important; }
    #preview .doc-sheet .bank-logo-img, #print-area .doc-sheet .bank-logo-img { height: 50px !important; width: auto !important; filter: none !important; opacity: 1 !important; }
    #preview .doc-sheet .watermark, #print-area .doc-sheet .watermark { opacity: 0.10 !important; width: 80% !important; max-width: 700px !important; }

    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: absolute; top: 0; right: 0; left: 0; margin: 0; padding: 0; }
      .doc-sheet { box-shadow: none; border: none; max-width: 100%; }
      @page { size: A4; margin: 8mm; }
    }

    /* ============================================
       🧮 CALCULATOR — Pro Edition (Light & Fast)
       ============================================ */
    #calc-fab {
      position: fixed;
      bottom: 22px;
      left: 22px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #F97316;
      cursor: pointer;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s, box-shadow .2s, background .2s;
      box-shadow: 0 4px 14px rgba(11,31,77,.3);
      padding: 0;
      overflow: hidden;
      font-family: 'Tajawal', sans-serif;
    }
    #calc-fab img {
      width: 75%;
      height: 75%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      transition: filter .2s;
    }
    #calc-fab:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 22px rgba(249,115,22,.45);
      background: #F97316;
    }
    #calc-fab:hover img {
      filter: brightness(0) invert(1);
    }
    #calc-fab:active { transform: scale(.95); }
    #calc-fab.active {
      background: linear-gradient(135deg, #F97316, #fb8c3c);
      transform: rotate(90deg);
    }
    #calc-fab.active img { display: none; }
    #calc-fab .calc-close-icon {
      display: none;
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }
    #calc-fab.active .calc-close-icon { display: block; }

    #calc-panel {
      position: fixed; bottom: 92px; left: 22px; width: 300px;
      background: #fff; border: 1px solid #E3E7EE; border-radius: 16px;
      box-shadow: 0 16px 40px rgba(11,31,77,.22); z-index: 9999;
      font-family: 'Tajawal', sans-serif; overflow: hidden;
      opacity: 0; transform: translateY(16px) scale(.96); pointer-events: none;
      transition: opacity .2s, transform .2s; will-change: transform, opacity;
    }
    #calc-panel.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

    .calc-header {
      background: linear-gradient(135deg, #0B1F4D, #132a63); color: #fff;
      padding: 11px 14px; display: flex; align-items: center; justify-content: space-between;
      cursor: move; user-select: none;
    }
    .calc-header .title { font-size: 14px; font-weight: 900; display: flex; align-items: center; gap: 7px; letter-spacing: .3px; }
    .calc-header .title::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #F97316; box-shadow: 0 0 8px #F97316; }
    .calc-header .close-btn {
      background: rgba(255,255,255,.14); color: #fff; width: 26px; height: 26px;

<!-- ============================================
     🧮 Calculator Logic
     ============================================ -->
<script>
(function() {
  'use strict';

  const fab        = document.getElementById('calc-fab');
  const panel      = document.getElementById('calc-panel');
  const exprEl     = document.getElementById('calc-expr');
  const resEl      = document.getElementById('calc-result');
  const handle     = document.getElementById('calc-drag-handle');
  const taxBtn     = document.getElementById('calc-tax-btn');
  const taxSetBtn  = document.getElementById('calc-tax-settings-btn');
  const taxSetBox  = document.getElementById('calc-tax-settings');
  const taxInput   = document.getElementById('calc-tax-input');
  const toastEl    = document.getElementById('calc-toast');

  let current  = '0';
  let previous = null;
  let operator = null;
  let justEval = false;
  let taxRate  = 15;

  let toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
  }

  function openCalc() {
    panel.classList.add('open');
    fab.classList.add('active');
  }
  function closeCalc() {
    panel.classList.remove('open');
    fab.classList.remove('active');
    taxSetBox.classList.remove('open');
    taxSetBtn.classList.remove('active');
  }
  function toggleCalc() {
    if (panel.classList.contains('open')) closeCalc(); else openCalc();
  }

  fab.addEventListener('click', toggleCalc);
  document.getElementById('calc-close').addEventListener('click', closeCalc);

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      toggleCalc();
      return;
    }
    if (e.key === 'Escape' && panel.classList.contains('open')) {
      if (taxSetBox.classList.contains('open')) {
        taxSetBox.classList.remove('open');
        taxSetBtn.classList.remove('active');
      } else {
        closeCalc();
      }
    }
  });

  // === السحب ===
  let isDragging = false, dragX = 0, dragY = 0, panelX = 0, panelY = 0;

  function startDrag(clientX, clientY) {
    const r = panel.getBoundingClientRect();
    isDragging = true;
    dragX = clientX; dragY = clientY;
    panelX = r.left; panelY = r.top;
    panel.style.transition = 'none';
    panel.style.left = panelX + 'px';
    panel.style.top  = panelY + 'px';
    panel.style.bottom = 'auto';
    panel.style.transform = 'none';
  }
  function doDrag(clientX, clientY) {
    if (!isDragging) return;
    panel.style.left = (panelX + clientX - dragX) + 'px';
    panel.style.top  = (panelY + clientY - dragY) + 'px';
  }
  function stopDrag() {
    if (!isDragging) return;
    isDragging = false;
    panel.style.transition = '';
  }

  handle.addEventListener('mousedown', (e) => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    startDrag(e.clientX, e.clientY);
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', (e) => doDrag(e.clientX, e.clientY));
  document.addEventListener('mouseup', () => { stopDrag(); document.body.style.userSelect = ''; });

  handle.addEventListener('touchstart', (e) => {
    if (e.target.closest('button')) return;
    const t = e.touches[0];
    startDrag(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const t = e.touches[0];
    doDrag(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener('touchend', stopDrag);

  // === أدوات ===
  function safeEval(expr) {
    if (!/^[\d+\-×÷%.() ]+$/.test(expr)) return NaN;
    try {
      const val = Function('"use strict"; return (' + expr.replace(/×/g,'*').replace(/÷/g,'/') + ')')();
      return (typeof val === 'number' && isFinite(val)) ? val : NaN;
    } catch { return NaN; }
  }
  function fmt(n) {
    if (!isFinite(n)) return 'خطأ';
    return (Math.round(n * 1e10) / 1e10).toString();
  }
  function updateDisplay() {
    resEl.textContent  = current;
    exprEl.textContent = (previous !== null && operator) ? previous + ' ' + operator : '';
  }

  function inputDigit(d) {
    if (justEval) { current = '0'; justEval = false; }
    if (d === '.' && current.includes('.')) return;
    current = (current === '0' && d !== '.') ? d : current + d;
    updateDisplay();
  }
  function inputOperator(op) {
    if (operator && previous !== null && !justEval) {
      const r = safeEval(previous + operator + current);
      if (isNaN(r)) { current = 'خطأ'; updateDisplay(); return; }
      previous = fmt(r);
      current  = previous;
    } else {
      previous = current;
    }
    operator = op;
    justEval = false;
    current  = '0';
    updateDisplay();
  }
  function evaluate() {
    if (!operator || previous === null) return;
    const r = safeEval(previous + operator + current);
    if (isNaN(r)) { current = 'خطأ'; updateDisplay(); return; }
    current = fmt(r);
    previous = null;
    operator = null;
    justEval = true;
    updateDisplay();
  }
  function clearAll() {
    current = '0'; previous = null; operator = null; justEval = false;
    updateDisplay();
  }
  function backspace() {
    if (justEval) { current = '0'; justEval = false; }
    else current = current.length <= 1 ? '0' : current.slice(0, -1);
    updateDisplay();
  }
  function percent() {
    current = fmt((parseFloat(current) || 0) / 100);
    updateDisplay();
  }
  function applyTax() {
    const n = parseFloat(current);
    if (isNaN(n)) return;
    current = fmt(n * (1 + taxRate / 100));
    justEval = true;
    updateDisplay();
    showToast('✅ +' + taxRate + '% → ' + current);
  }

  // === ربط الأزرار ===
  const keysContainer = document.querySelector('.calc-keys');
  keysContainer.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-key]');
    if (!btn) return;
    const k = btn.dataset.key;
    if (/^\d$/.test(k) || k === '.') inputDigit(k);
    else if (['+','-','×','÷'].includes(k)) inputOperator(k);
    else if (k === '=') evaluate();
    else if (k === 'C') clearAll();
    else if (k === '⌫') backspace();
    else if (k === '%') percent();
  });

  // === الضريبة ===
  taxBtn.addEventListener('click', applyTax);

  taxSetBtn.addEventListener('click', () => {
    taxSetBox.classList.toggle('open');
    taxSetBtn.classList.toggle('active');
    if (taxSetBox.classList.contains('open')) {
      taxInput.focus();
      taxInput.select();
    }
  });

  function updateTaxRate() {
    let val = parseFloat(taxInput.value);
    if (isNaN(val) || val < 0) val = 0;
    if (val > 100) val = 100;
    taxRate = val;
    taxBtn.textContent = '💰 ضريبة ' + (Number.isInteger(taxRate) ? taxRate : taxRate.toFixed(2)) + '%';
  }
  taxInput.addEventListener('input', updateTaxRate);
  taxInput.addEventListener('change', () => taxInput.value = taxRate);
  taxInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      taxSetBox.classList.remove('open');
      taxSetBtn.classList.remove('active');
      updateTaxRate();
    }
  });

  // === لوحة المفاتيح ===
  document.addEventListener('keydown', (e) => {
    if (!panel.classList.contains('open')) return;
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    const k = e.key;
    let action = null;

    if (/^\d$/.test(k) || k === '.') action = () => inputDigit(k);
    else if (k === '+') action = () => inputOperator('+');
    else if (k === '-') action = () => inputOperator('-');
    else if (k === '*') action = () => inputOperator('×');
    else if (k === '/') action = () => inputOperator('÷');
    else if (k === '%') action = () => percent();
    else if (k === 'Enter' || k === '=') action = evaluate;
    else if (k === 'Backspace') action = backspace;

    if (action) { e.preventDefault(); action(); }
  });

  updateDisplay();
  console.log('🧮 Calculator ready — Ctrl+K to toggle');
})();
</script>

      const snapshot = await get(child(metaRef, 'nextNumber'));
      if (snapshot.exists()) return snapshot.val();
      const startNum = SETTINGS.startNumber || 1;
      await set(child(metaRef, 'nextNumber'), startNum);
      return startNum;
    } catch (error) {
      console.error('Error getting next number:', error);
      return SETTINGS.startNumber || 1;
    }
  }

  async function commitDocNumber() {
    try {
      const currentNum = await getNextDocNumber();
      await set(child(metaRef, 'nextNumber'), currentNum + 1);
      SETTINGS.nextNumber = currentNum + 1;
      await saveSettings(SETTINGS);
    } catch (error) {
      console.error('Error committing doc number:', error);
    }
  }

  function nextDocNumber() {
    const n = SETTINGS.nextNumber || SETTINGS.startNumber || 1;

  function numberToArabicWords(num) {
    num = Math.floor(Number(num) || 0);
    if (num === 0) return 'صفر ريال سعودي فقط لا غير';
    const ones = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر',
      'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
    const tens = ['', 'عشرة', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
    const hundreds = ['', 'مائة', 'مئتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];

    function threeDigits(n) {
      let s = '';
      const h = Math.floor(n / 100), r = n % 100;
      if (h > 0) s += hundreds[h];
      if (r > 0) {
        if (s) s += ' و';
        if (r < 20) s += ones[r];
        else {
          const t = Math.floor(r / 10), o = r % 10;
          s += (o > 0 ? ones[o] + ' و' : '') + tens[t];
        }
      }
      return s;
    }
    function group(n, s, d, p) {
      if (n === 0) return '';
      if (n === 1) return s;
      if (n === 2) return d;
      if (n >= 3 && n <= 10) return threeDigits(n) + ' ' + p;
      return threeDigits(n) + ' ' + s;
    }
    const m = Math.floor(num / 1000000), th = Math.floor((num % 1000000) / 1000), rest = num % 1000;
    let parts = [];
    if (m > 0) parts.push(group(m, 'مليون', 'مليونان', 'ملايين'));
    if (th > 0) parts.push(group(th, 'ألف', 'ألفان', 'آلاف'));
    if (rest > 0) parts.push(threeDigits(rest));
    return (parts.filter(Boolean).join(' و') || 'صفر') + ' ريال سعودي فقط لا غير';
  }

  function computeTotals(doc) {
    let s = 0, v = 0;
    const t = TYPES[doc.type];
    const tax = safeNumber(doc.taxPercent || 15);
    doc.items.forEach(it => {
      let totalBeforeTax = 0;
      if (t.isPrecast) totalBeforeTax = roundToTwo(safeNumber(it.qty) * safeNumber(it.unitPriceWithoutTax));
      else totalBeforeTax = roundToTwo(safeNumber(it.qty) * safeNumber(it.price));
      s += totalBeforeTax;
      v += roundToTwo(totalBeforeTax * (tax / 100));
    });
    return { subtotal: roundToTwo(s), vat: roundToTwo(v), grand: roundToTwo(s + v) };
  }

    return `<div class="doc-sheet">

  <div class="doc-header">

  <div class="info-grid">

      ${infoLineWithGreen('طريقة الدفع', doc.paymentMethod, 'paymentMethod')}

    </div>
    <div class="info-box"><h5>تفاصيل العرض</h5>
      ${infoLineWithGreen('المشروع', doc.project, 'project')}

      ${infoLineWithGreen('الضريبة', (doc.taxPercent||15)+'%', 'taxPercent')}
      ${infoLineWithGreen('وصف الأعمال', doc.workDescription, 'workDescription')}
      ${infoLineWithGreen('مقدم العرض', doc.preparedBy, 'preparedBy')}
      ${infoLineWithGreen('الموقع', doc.location2, 'location2')}
    </div>
  </div>
  <div class="doc-table-wrap">
    <table class="doc-table">
      <thead><tr><th>م</th><th>${t.itemLabel}</th>${t.isPrecast ? `<th>${sizeLabel}</th>` : `<th>الوحدة</th>`}<th>${qtyLabel}</th><th>${priceLabel}</th><th>${priceWithTaxLabel}</th><th>الضريبة</th><th>الإجمالي شامل الضريبة</th></tr></thead>
      <tbody>${doc.items.map((it,i)=>{
        const tax = safeNumber(doc.taxPercent || 15);
        let totalBeforeTax = 0, price = 0, priceWithTax = 0, qty = 0, size = '';
        if (t.isPrecast) {
          qty = safeNumber(it.qty);
          price = safeNumber(it.unitPriceWithoutTax);
          size = it.size || '—';
          totalBeforeTax = roundToTwo(qty * price);
          priceWithTax = safeNumber(it.unitPriceWithTax) || roundToTwo(price * (1 + (tax / 100)));
        } else {
          qty = safeNumber(it.qty);
          price = safeNumber(it.price);
          totalBeforeTax = roundToTwo(qty * price);
          priceWithTax = safeNumber(it.priceWithTax) || roundToTwo(price * (1 + (tax / 100)));
        }
        const taxAmount = roundToTwo(totalBeforeTax * (tax / 100));
        const totalWithTax = roundToTwo(totalBeforeTax + taxAmount);
        return `<tr><td>${i+1}</td><td>${it.desc||'—'}</td>${t.isPrecast ? `<td>${size}</td>` : `<td>${it.unit||'—'}</td>`}<td>${qty||0}</td><td>${money(price)}</td><td style="color:var(--orange);font-weight:700;">${money(priceWithTax)}</td><td>${money(taxAmount)}</td><td>${money(totalWithTax)}</td></tr>`;

  </div>
  <div class="total-bar ${totalHiddenClass}"><span>الإجمالي شامل الضريبة (${doc.taxPercent||15}%)</span><span class="amt">${money(tot.grand)} ريال</span></div>
  ${(t.terms&&(doc.priceTerms||doc.deliveryTerms))?`<div class="notes-box" style="margin-top:14px;"><b>شروط التنفيذ</b><ul>${doc.priceTerms?'<li>'+doc.priceTerms+'</li>':''}${doc.deliveryTerms?'<li>'+doc.deliveryTerms+'</li>':''}</ul></div>`:''}
  ${fixedNotesHTML}
  ${showBank ? bankBox() : ''}
  ${fixedNotes ? `<div class="notes-box" style="padding-bottom:6px;">${fixedNotes}</div>` : ''}
  ${footerBar()}</div>`;
  }

  function receiptPreview(doc) {

  <div class="info-grid" style="grid-template-columns:1fr 1fr 1fr;">
    <div class="info-box"><h5>طريقة السداد</h5>${infoLine('الطريقة',doc.paymentMethod)}</div>

  function bindForm(type, id) {
    const t = TYPES[type];
    const doc = window._currentDoc;

    function refreshPreview() {
      document.getElementById('preview').innerHTML = t.kind === 'quote' ? quotePreview(t, doc) : receiptPreview(doc);
    }

    function calculateItem(item, taxPercent, triggeredField) {
      const tax = safeNumber(taxPercent);
      if (t.isPrecast) {
        let qty = safeNumber(item.qty);
        let unitPriceWithoutTax = safeNumber(item.unitPriceWithoutTax);
        let unitPriceWithTax = safeNumber(item.unitPriceWithTax);
        let totalWithTax = safeNumber(item.totalWithTax);
        if (triggeredField === 'qty' || triggeredField === 'unitPriceWithoutTax') {
          const totalBeforeTax = roundToTwo(qty * unitPriceWithoutTax);
          const taxAmount = roundToTwo(totalBeforeTax * (tax / 100));
          totalWithTax = roundToTwo(totalBeforeTax + taxAmount);
          unitPriceWithTax = roundToTwo(unitPriceWithoutTax * (1 + (tax / 100)));
        } else if (triggeredField === 'unitPriceWithTax') {
          if (unitPriceWithTax > 0) {
            unitPriceWithoutTax = roundToTwo(unitPriceWithTax / (1 + (tax / 100)));
            const totalBeforeTax = roundToTwo(qty * unitPriceWithoutTax);
            const taxAmount = roundToTwo(totalBeforeTax * (tax / 100));
            totalWithTax = roundToTwo(totalBeforeTax + taxAmount);
          }
        } else if (triggeredField === 'totalWithTax') {
          if (totalWithTax > 0 && qty > 0) {
            const totalBeforeTax = roundToTwo(totalWithTax / (1 + (tax / 100)));
            unitPriceWithoutTax = roundToTwo(totalBeforeTax / qty);
            unitPriceWithTax = roundToTwo(unitPriceWithoutTax * (1 + (tax / 100)));
          }
        }
        item.qty = qty; item.unitPriceWithoutTax = unitPriceWithoutTax;
        item.unitPriceWithTax = unitPriceWithTax; item.totalWithTax = totalWithTax;
        return { unitPriceWithoutTax, unitPriceWithTax, totalWithTax };
      } else {
        let qty = safeNumber(item.qty);
        let price = safeNumber(item.price);
        let priceWithTax = safeNumber(item.priceWithTax);
        let totalWithTax = safeNumber(item.totalWithTax);
        if (triggeredField === 'qty' || triggeredField === 'price') {
          const totalBeforeTax = roundToTwo(qty * price);
          const taxAmount = roundToTwo(totalBeforeTax * (tax / 100));
          totalWithTax = roundToTwo(totalBeforeTax + taxAmount);
          priceWithTax = roundToTwo(price * (1 + (tax / 100)));
        } else if (triggeredField === 'priceWithTax') {
          if (priceWithTax > 0) {
            price = roundToTwo(priceWithTax / (1 + (tax / 100)));
            const totalBeforeTax = roundToTwo(qty * price);
            const taxAmount = roundToTwo(totalBeforeTax * (tax / 100));
            totalWithTax = roundToTwo(totalBeforeTax + taxAmount);
          }
        } else if (triggeredField === 'totalWithTax') {
          if (totalWithTax > 0 && qty > 0) {
            const totalBeforeTax = roundToTwo(totalWithTax / (1 + (tax / 100)));
            price = roundToTwo(totalBeforeTax / qty);
            priceWithTax = roundToTwo(price * (1 + (tax / 100)));
          }
        }
        item.qty = qty; item.price = price;
        item.priceWithTax = priceWithTax; item.totalWithTax = totalWithTax;
        return { price, priceWithTax, totalWithTax };
      }
    }

    function updateRowFields(tr, item) {
      if (t.isPrecast) {
        const qtyInput = tr.querySelector('[data-if="qty"]');
        const priceInput = tr.querySelector('[data-if="unitPriceWithoutTax"]');
        const priceWithTaxInput = tr.querySelector('[data-if="unitPriceWithTax"]');
        const totalInput = tr.querySelector('[data-if="totalWithTax"]');
        const taxCells = tr.querySelectorAll('td');
        const taxCell = taxCells[6];
        if (qtyInput && document.activeElement !== qtyInput) qtyInput.value = item.qty || '';
        if (priceInput && document.activeElement !== priceInput) priceInput.value = item.unitPriceWithoutTax || '';
        if (priceWithTaxInput && document.activeElement !== priceWithTaxInput) priceWithTaxInput.value = item.unitPriceWithTax || '';
        if (totalInput && document.activeElement !== totalInput) totalInput.value = item.totalWithTax || '';
        if (taxCell) {
          const totalBeforeTax = roundToTwo(item.qty * item.unitPriceWithoutTax);
          const taxAmount = roundToTwo(totalBeforeTax * (safeNumber(doc.taxPercent) / 100));
          taxCell.textContent = money(taxAmount);
        }
      } else {
        const qtyInput = tr.querySelector('[data-if="qty"]');
        const priceInput = tr.querySelector('[data-if="price"]');
        const priceWithTaxInput = tr.querySelector('[data-if="priceWithTax"]');
        const totalInput = tr.querySelector('[data-if="totalWithTax"]');
        const taxCells = tr.querySelectorAll('td');
        const taxCell = taxCells[6];
        if (qtyInput && document.activeElement !== qtyInput) qtyInput.value = item.qty || '';
        if (priceInput && document.activeElement !== priceInput) priceInput.value = item.price || '';
        if (priceWithTaxInput && document.activeElement !== priceWithTaxInput) priceWithTaxInput.value = item.priceWithTax || '';
        if (totalInput && document.activeElement !== totalInput) totalInput.value = item.totalWithTax || '';
        if (taxCell) {
          const totalBeforeTax = roundToTwo(item.qty * item.price);
          const taxAmount = roundToTwo(totalBeforeTax * (safeNumber(doc.taxPercent) / 100));
          taxCell.textContent = money(taxAmount);
        }
      }
    }

    document.getElementById('form-panels').addEventListener('input', function(e) {
      const f = e.target.dataset.f;
      if (f) { doc[f] = e.target.value; refreshPreview(); return; }
      const ifld = e.target.dataset.if;
      if (ifld) {
        const tr = e.target.closest('tr');
        if (!tr) return;
        const itemId = tr.dataset.id;
        const item = doc.items.find(x => x.id === itemId);
        if (!item) return;
        let val = e.target.value;
        if (ifld === 'qty' || ifld === 'price' || ifld === 'priceWithTax' || 
            ifld === 'totalWithTax' || ifld === 'unitPriceWithoutTax' || 
            ifld === 'unitPriceWithTax') {
          if (val === '') item[ifld] = '';
          else {
            const num = parseFloat(val);
            if (!isNaN(num) && isFinite(num)) item[ifld] = num;
            else item[ifld] = val;
          }
        } else item[ifld] = val;
        const taxPercent = safeNumber(doc.taxPercent || 15);
        if (['qty', 'price', 'priceWithTax', 'totalWithTax', 'unitPriceWithoutTax', 'unitPriceWithTax'].includes(ifld)) {
          const currentVal = item[ifld];
          if (currentVal !== '' && currentVal !== null && currentVal !== undefined) {
            const numVal = parseFloat(currentVal);
            if (!isNaN(numVal) && isFinite(numVal)) {
              item[ifld] = numVal;
              calculateItem(item, taxPercent, ifld);
            }
          }
        }
        updateRowFields(tr, item);
        refreshPreview();
      }
    });

    document.getElementById('form-panels').addEventListener('click', async e => {
      if (e.target.id === 'add-row') {
        doc.items.push(emptyItem(t.isPrecast));
        document.getElementById('items-body').innerHTML = doc.items.map((it, i) => itemRow(it, i, t, doc.taxPercent)).join('');
        refreshPreview();
      }
      const rmId = e.target.dataset.rm;
      if (rmId) {
        doc.items = doc.items.filter(x => x.id !== rmId);
        if (!doc.items.length) doc.items.push(emptyItem(t.isPrecast));
        document.getElementById('items-body').innerHTML = doc.items.map((it, i) => itemRow(it, i, t, doc.taxPercent)).join('');
        refreshPreview();
      }
      if (e.target.id === 'save-doc') {
        const success = await persistDoc(doc);
        if (success) { toast('✅ تم الحفظ'); go('#/archive'); }
      }
      if (e.target.id === 'save-print') {
        const success = await persistDoc(doc);
        if (success) { toast('✅ تم الحفظ'); setTimeout(() => go('#/view/' + doc.id + '?print=1'), 150); }
      }
      if (e.target.id === 'cancel-form') go('#/dashboard');

      if (e.target.id === 'download-pdf-form') {
        refreshPreview();
        const defaultName = doc.number + ' - ' + (doc.customerName || doc.receivedFrom || 'مستند');
        const fileName = prompt('أدخل اسم ملف PDF:', defaultName);
        if (fileName === null) return;
        const finalName = (fileName.trim() || defaultName).replace(/[\\/:*?"<>|]/g, '-');
        const btn = e.target;
        const originalText = btn.innerHTML;
        btn.innerHTML = '⏳ جاري التجهيز...';
        btn.disabled = true;
        const element = document.querySelector('#preview .doc-sheet');
        const opt = {
          margin: [5, 5, 5, 5], filename: finalName + '.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 3, useCORS: true, letterRendering: true },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save().then(() => {
          btn.innerHTML = originalText; btn.disabled = false;
          toast('✅ تم تحميل: ' + finalName + '.pdf');
        }).catch(err => {
          console.error(err);
          btn.innerHTML = originalText; btn.disabled = false;
          toast('❌ حدث خطأ أثناء إنشاء PDF');
        });
      }
    });

    const toggleBtn = document.getElementById('toggle-total-btn');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', async function() {
        doc.showTotal = !doc.showTotal;
        await saveDoc(doc);
        this.textContent = doc.showTotal ? '🔽 إخفاء الإجمالي' : '🔼 إظهار الإجمالي';
        this.className = doc.showTotal ? 'btn-toggle-total showing' : 'btn-toggle-total';
        refreshPreview();
        toast(doc.showTotal ? '✅ تم إظهار الإجمالي' : '✅ تم إخفاء الإجمالي');
      });
    }

    const toggleNumBtn = document.getElementById('toggle-number-btn');
    if (toggleNumBtn) {
      toggleNumBtn.addEventListener('click', async function() {
        doc.showNumber = !doc.showNumber;
        await saveDoc(doc);
        this.textContent = doc.showNumber ? '🔢 إخفاء رقم العرض' : '🔢 إظهار رقم العرض';
        this.className = doc.showNumber ? 'btn-toggle-number showing' : 'btn-toggle-number';
        refreshPreview();
        toast(doc.showNumber ? '✅ تم إظهار الرقم' : '✅ تم إخفاء الرقم');
      });
    }

    const toggleBankBtn = document.getElementById('toggle-bank-btn');
    if (toggleBankBtn) {
      toggleBankBtn.addEventListener('click', async function() {
        doc.showBank = !doc.showBank;
        await saveDoc(doc);
        this.textContent = doc.showBank ? '🏦 إخفاء بيانات البنك' : '🏦 إظهار بيانات البنك';
        this.className = doc.showBank ? 'btn-toggle-number showing' : 'btn-toggle-number';
        refreshPreview();
        toast(doc.showBank ? '✅ تم إظهار البنك' : '✅ تم إخفاء البنك');
      });
    }

    document.querySelector('[data-f="taxPercent"]')?.addEventListener('change', function() {
      doc.taxPercent = safeNumber(this.value);
      doc.items.forEach(item => {
        if (t.isPrecast) calculateItem(item, doc.taxPercent, 'unitPriceWithoutTax');
        else calculateItem(item, doc.taxPercent, 'price');
      });
      document.getElementById('items-body').innerHTML = doc.items.map((it, i) => itemRow(it, i, t, doc.taxPercent)).join('');
      refreshPreview();
    });
  }

  async function persistDoc(doc) {
    const isNew = !DOCS.find(d => d.id === doc.id);
    if (isNew) await commitDocNumber();
    return await saveDoc(doc);
  }

  function renderViewPage(id) {
    const doc = DOCS.find(d => d.id === id);
    if (!doc) return '<p>غير موجود</p>';
    const t = TYPES[doc.type],
      html = t.kind === 'quote' ? quotePreview(t, doc) : receiptPreview(doc);
    const whatsappLink = getWhatsAppLink(doc);
    const hasContact = doc.contact && doc.contact.replace(/[\s\-\(\)]/g, '').length > 0;

    return `<div class="actions-bar" style="margin-bottom:16px;">
    <button class="btn-pdf" id="do-download-pdf">📥 تحميل PDF</button>
    <button class="btn-secondary" id="do-print">🖨️ طباعة مباشرة</button>
    <button class="btn-ghost" id="do-edit">✏️ تعديل</button>
    <button class="btn-ghost" id="do-duplicate">🧾 نسخ</button>
    ${hasContact ? `<a href="${whatsappLink}" target="_blank" class="btn-whatsapp">💬 واتساب</a>` : `<span class="btn-whatsapp disabled" style="padding:11px 20px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;background:#ccc;color:#666;cursor:not-allowed;">💬 لا يوجد رقم</span>`}
    <button class="btn-ghost" id="back-archive">↩ رجوع</button></div>
  <div id="print-area">${html}</div>`;
  }

  function bindViewPage(id) {
    const doc = DOCS.find(d => d.id === id);

    document.getElementById('do-download-pdf').addEventListener('click', () => {
      const defaultName = doc.number + ' - ' + (doc.customerName || doc.receivedFrom || 'مستند');
      const fileName = prompt('أدخل اسم ملف PDF:', defaultName);
      if (fileName === null) return;
      const finalName = (fileName.trim() || defaultName).replace(/[\\/:*?"<>|]/g, '-');
      const btn = document.getElementById('do-download-pdf'), orig = btn.innerHTML;
      btn.innerHTML = '⏳ جاري التجهيز...'; btn.disabled = true;
      const element = document.querySelector('.doc-sheet');
      const opt = { margin: [5, 5, 5, 5], filename: finalName + '.pdf', image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 3, useCORS: true, letterRendering: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
      html2pdf().set(opt).from(element).save().then(() => {
        btn.innerHTML = orig; btn.disabled = false;
        toast('✅ تم تحميل: ' + finalName + '.pdf');
      }).catch(() => {
        btn.innerHTML = orig; btn.disabled = false;
        toast('❌ خطأ');
      });
    });

    document.getElementById('do-print').addEventListener('click', () => window.print());
    document.getElementById('do-edit').addEventListener('click', () => go('#/form/' + doc.type + '/' + doc.id));
    document.getElementById('do-duplicate').addEventListener('click', async () => {
      const c = JSON.parse(JSON.stringify(doc));
      c.id = uid(); c.number = nextDocNumber(); c.date = todayStr(); c.status = 'pending';
      await commitDocNumber();
      await saveDoc(c);
      toast('✅ نسخة جديدة: ' + c.number);
      go('#/form/' + c.type + '/' + c.id);
    });
    document.getElementById('back-archive').addEventListener('click', () => go('#/archive'));
    if (location.hash.includes('print=1')) setTimeout(() => window.print(), 300);
  }

  function renderArchive() {
    if (!DOCS.length) return `<h1 class="page-title">الأرشيف</h1><p class="page-sub">المستندات المحفوظة</p><div class="empty-state"><div class="em">🗂️</div>لا توجد مستندات محفوظة.</div>`;
    return `<h1 class="page-title">الأرشيف</h1><p class="page-sub">${DOCS.length} مستند</p>
  <div class="archive-toolbar"><input id="search" placeholder="ابحث بالاسم، الرقم..."><select id="filter-type"><option value="">كل الأنواع</option>${Object.values(TYPES).map(t=>`<option value="${t.key}">${t.title}</option>`).join('')}</select></div>
  <table class="archive-table"><thead><tr><th>الرقم</th><th>النوع</th><th>العميل</th><th>التاريخ</th><th>الحالة</th><th>الإجمالي</th><th></th></tr></thead><tbody id="archive-body">${archiveRows(DOCS)}</tbody></table>`;
  }

  function archiveRows(list) {
    return list.map(d => {
      const t = TYPES[d.type];
      if (!t) return '';
      const name = t.kind === 'quote' ? (d.customerName || '—') : (d.receivedFrom || '—'),
        total = t.kind === 'quote' ? money(computeTotals(d).grand) : money(d.amount);
      const whatsappLink = getWhatsAppLink(d);
      const hasContact = d.contact && d.contact.replace(/[\s\-\(\)]/g, '').length > 0;
      return `<tr><td><b>${d.number}</b></td><td>${t.title}</td><td>${name}</td><td>${d.date}</td><td>${statusPill(d)}</td><td>${total} ريال</td><td class="row-actions">
        <button data-view="${d.id}">👁️</button>
        <button data-edit="${d.id}" data-type="${d.type}">✏️</button>
        <button data-del="${d.id}">🗑️</button>
        ${hasContact ? `<a href="${whatsappLink}" target="_blank" class="btn-whatsapp-small" title="إرسال عبر واتساب">💬</a>` : `<span class="btn-whatsapp-small disabled" title="لا يوجد رقم">💬</span>`}
      </td></tr>`;
    }).join('');
  }

  function statusPill(d) {
    if (TYPES[d.type].kind !== 'quote') return '<span class="pill approved">مكتمل</span>';
    const m = { pending: ['قيد الانتظار', 'pending'], approved: ['تمت الموافقة', 'approved'], rejected: ['مرفوض', 'rejected'] };
    const [l, c] = m[d.status || 'pending'];
    return `<select class="pill ${c}" data-status="${d.id}" style="border:none;background:transparent;font-weight:700;">${Object.entries(m).map(([k,v])=>`<option value="${k}" ${d.status===k?'selected':''}>${v[0]}</option>`).join('')}</select>`;
  }

  function bindArchive() {
    document.getElementById('search').addEventListener('input', filterArchive);
    document.getElementById('filter-type').addEventListener('change', filterArchive);

    function filterArchive() {
      const q = document.getElementById('search').value.trim().toLowerCase(),
        ty = document.getElementById('filter-type').value;
      const f = DOCS.filter(d => {
        const t = TYPES[d.type];
        if (!t) return false;
        const n = t.kind === 'quote' ? (d.customerName || '') : (d.receivedFrom || '');
        return (!q || d.number.toLowerCase().includes(q) || n.toLowerCase().includes(q) || t.title.toLowerCase().includes(q)) && (!ty || d.type === ty);
      });
      document.getElementById('archive-body').innerHTML = archiveRows(f);
      bindArchiveRowActions();
    }
    bindArchiveRowActions();
  }

  function bindArchiveRowActions() {
    document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => go('#/view/' + b.dataset.view));
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => go('#/form/' + b.dataset.type + '/' + b.dataset.edit));
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (confirm('تأكيد الحذف؟')) {
        const success = await deleteDoc(b.dataset.del);
        if (success) toast('🗑️ تم الحذف');
      }
    });
    document.querySelectorAll('[data-status]').forEach(s => s.onchange = async e => {
      const d = DOCS.find(x => x.id === s.dataset.status);
      if (d) { d.status = e.target.value; await saveDoc(d); toast('تم التحديث'); }
    });
  }

  function renderSettings() {
    const s = SETTINGS;
    const fixedFields = s.fixedFields || DEFAULT_SETTINGS.fixedFields;
    const fixedVals = s.fixedValues || DEFAULT_SETTINGS.fixedValues;
    const fixedNotes = s.fixedNotes || DEFAULT_SETTINGS.fixedNotes;
    const showTotal = s.showTotal !== undefined ? s.showTotal : true;
    const typeFixedNotes = s.typeFixedNotes || {};

    function fixedCheckbox(fieldKey, label) {
      const checked = fixedFields[fieldKey] === true ? 'checked' : '';
      return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <input type="checkbox" id="ff-${fieldKey}" ${checked}>
        <label for="ff-${fieldKey}" style="font-size:13px;font-weight:500;color:var(--text);">${label}</label>
        <span style="font-size:11px;color:var(--green);margin-right:auto;">${checked?'🟢 ثابت':'⚪ غير ثابت'}</span>
      </div>`;
    }

    function fixedValueField(fieldKey, label, type = 'text') {
      const val = fixedVals[fieldKey] || '';
      return `<div class="field"><label style="color:var(--green);">${label}</label>
        <input id="fv-${fieldKey}" type="${type}" value="${val}" placeholder="أدخل القيمة الثابتة..."></div>`;
    }

    let typeNotesHTML = '';
    Object.keys(TYPES).forEach(key => {
      const t = TYPES[key];
      if (t.kind === 'quote') {
        const noteValue = typeFixedNotes[key] || '';
        typeNotesHTML += `
          <div style="margin-bottom:10px;border:1px solid var(--border);border-radius:8px;padding:10px;">
            <label style="font-weight:700;font-size:13px;color:var(--navy);">${t.icon} ${t.title}</label>
            <textarea id="type-note-${key}" rows="2" style="width:100%;margin-top:5px;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fbfcfe;color:var(--text);">${noteValue}</textarea>
          </div>`;
      }
    });

    return `<h1 class="page-title">⚙️ الإعدادات</h1><p class="page-sub">تحكم في جميع بيانات الشركة واختر الحقول الثابتة التي تظهر باللون الأخضر</p>
  <div class="settings-grid">
    <div class="panel"><h4>🏢 بيانات الشركة</h4>
      <div class="field"><label>اسم الشركة (سطر 1)</label><input id="s-companyLine1" value="${s.companyLine1}"></div>
      <div class="field"><label>اسم الشركة (سطر 2)</label><input id="s-companyLine2" value="${s.companyLine2}"></div>
      <div class="field"><label>الشعار</label><input id="s-slogan" value="${s.slogan}"></div>
      <div class="field"><label>الرقم الضريبي</label><input id="s-taxNumber" value="${s.taxNumber}"></div>
      <div class="field"><label>العنوان</label><input id="s-address" value="${s.address}"></div>
    </div>
    <div class="panel"><h4>📞 التواصل</h4>
      <div class="field"><label>الهاتف</label><input id="s-phone" value="${s.phone}"></div>
      <div class="field"><label>البريد</label><input id="s-email" value="${s.email}"></div>
      <div class="field"><label>الموقع</label><input id="s-website" value="${s.website}"></div>
      <div class="field"><label>رقم واتساب</label><input id="s-whatsapp" value="${s.whatsappNumber || '966508346559'}" placeholder="مثال: 966508346559"></div>
    </div>
    <div class="panel"><h4>🏦 البنك</h4>
      <div class="field"><label>اسم البنك (عربي)</label><input id="s-bankName" value="${s.bankName}"></div>
      <div class="field"><label>اسم البنك (إنجليزي)</label><input id="s-bankNameEn" value="${s.bankNameEn || 'alrajhi bank'}"></div>
      <div class="field"><label>رقم الحساب</label><input id="s-accountNumber" value="${s.accountNumber}"></div>
      <div class="field"><label>الآيبان</label><input id="s-iban" value="${s.iban}"></div>
    </div>
    <div class="panel"><h4>🔢 الترقيم</h4>
      <div class="field"><label>السنة</label><input id="s-year" value="${s.year}"></div>
      <div class="field"><label>الرقم التالي</label><input id="s-nextNumber" type="number" value="${s.nextNumber}"></div>
    </div>
    <div class="panel" style="grid-column:1/-1;"><h4>📝 الملاحظات الثابتة العامة</h4>
      <div class="field"><label>نص الملاحظة الثابتة (تظهر في جميع العروض)</label>
        <textarea id="s-fixedNotes" rows="3" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fbfcfe;color:var(--text);">${fixedNotes}</textarea>
      </div>
    </div>
    <div class="panel" style="grid-column:1/-1;"><h4>📝 ملاحظات ثابتة خاصة بكل نوع عرض</h4>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">كل نوع عرض له ملاحظاته الثابتة المستقلة التي تظهر تحت شروط التنفيذ</p>
      ${typeNotesHTML}
    </div>
    <div class="panel" style="grid-column:1/-1;"><h4>🟢 الحقول الثابتة</h4>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">حدد الحقول التي تريد أن تكون ثابتة واملأ قيمها</p>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;">
        ${fixedCheckbox('location', 'الموقع')}
        ${fixedCheckbox('taxNumberClient', 'الرقم الضريبي للعميل')}
        ${fixedCheckbox('paymentMethod', 'طريقة الدفع')}
        ${fixedCheckbox('project', 'المشروع')}
        ${fixedCheckbox('materialType', 'نوع الخرسانة')}
        ${fixedCheckbox('taxPercent', 'الضريبة')}
        ${fixedCheckbox('workDescription', 'وصف الأعمال')}
        ${fixedCheckbox('preparedBy', 'مقدم العرض')}
        ${fixedCheckbox('location2', 'الموقع (تفاصيل)')}
      </div>
      <h5 style="color:var(--green);margin:10px 0 8px;">قيم الحقول الثابتة:</h5>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        ${fixedValueField('location', 'الموقع')}
        ${fixedValueField('taxNumberClient', 'الرقم الضريبي للعميل')}
        ${fixedValueField('paymentMethod', 'طريقة الدفع')}
        ${fixedValueField('project', 'المشروع')}
        ${fixedValueField('materialType', 'نوع الخرسانة')}
        ${fixedValueField('taxPercent', 'الضريبة (%)', 'number')}
        ${fixedValueField('workDescription', 'وصف الأعمال')}
        ${fixedValueField('preparedBy', 'مقدم العرض')}
        ${fixedValueField('location2', 'الموقع (تفاصيل)')}
      </div>
    </div>
    <div class="panel" style="grid-column:1/-1;"><h4>⚙️ إعدادات العرض</h4>
      <div style="display:flex;align-items:center;gap:12px;padding:10px 0;">
        <label style="font-weight:700;font-size:14px;">🔽 إظهار الإجمالي في المعاينة</label>
        <input type="checkbox" id="s-showTotal" ${showTotal ? 'checked' : ''}>
      </div>
    </div>
  </div>
  <div class="actions-bar"><button class="btn-primary" id="save-settings">💾 حفظ جميع الإعدادات</button></div>`;
  }

  function bindSettings() {
    document.getElementById('save-settings').addEventListener('click', async () => {
      const fixedFields = {};
      const fieldKeys = ['location', 'taxNumberClient', 'paymentMethod', 'project', 'materialType', 'taxPercent',
        'workDescription', 'preparedBy', 'location2'];
      fieldKeys.forEach(key => {
        const checkbox = document.getElementById('ff-' + key);
        fixedFields[key] = checkbox ? checkbox.checked : false;
      });

      const fixedValues = {};
      fieldKeys.forEach(key => {
        const input = document.getElementById('fv-' + key);
        fixedValues[key] = input ? input.value : '';
      });
      fixedValues.taxPercent = Number(fixedValues.taxPercent) || 15;

      const fixedNotes = document.getElementById('s-fixedNotes').value;
      const showTotal = document.getElementById('s-showTotal').checked;

      const typeFixedNotes = {};
      Object.keys(TYPES).forEach(key => {
        const t = TYPES[key];
        if (t.kind === 'quote') {
          const noteInput = document.getElementById('type-note-' + key);
          typeFixedNotes[key] = noteInput ? noteInput.value : '';
        }
      });

      const newSettings = {
        ...SETTINGS,
        companyLine1: document.getElementById('s-companyLine1').value,
        companyLine2: document.getElementById('s-companyLine2').value,
        slogan: document.getElementById('s-slogan').value,
        taxNumber: document.getElementById('s-taxNumber').value,
        address: document.getElementById('s-address').value,
        phone: document.getElementById('s-phone').value,
        email: document.getElementById('s-email').value,
        website: document.getElementById('s-website').value,
        whatsappNumber: document.getElementById('s-whatsapp').value,
        bankName: document.getElementById('s-bankName').value,
        bankNameEn: document.getElementById('s-bankNameEn').value,
        accountNumber: document.getElementById('s-accountNumber').value,
        iban: document.getElementById('s-iban').value,
        year: document.getElementById('s-year').value,
        nextNumber: Number(document.getElementById('s-nextNumber').value),
        fixedNotes: fixedNotes,
        fixedFields: fixedFields,
        fixedValues: fixedValues,
        showTotal: showTotal,
        typeFixedNotes: typeFixedNotes
      };

      await saveSettings(newSettings);
      toast('✅ تم حفظ جميع الإعدادات');
    });
  }
</script>
</body>
</html>

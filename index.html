<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صروح الثبات | نظام عروض الأسعار</title>
<link rel="icon" type="image/jpeg" href="https://i.ibb.co/VYhvBfBB/IMG-20260725-WA0001.jpg">
<meta name="description" content="صروح الثبات - نظام عروض الأسعار وإدارة المستندات">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--navy:#0B1F4D;--navy-2:#132a63;--orange:#F97316;--orange-2:#fb8c3c;--bg:#F3F5F9;--card:#fff;--border:#E3E7EE;--text:#1C2333;--muted:#7A8296;--green:#1E9E5A;--red:#E0433A;--whatsapp:#25D366;--purple:#6d28d9;--topbar-bg:#0B1F4D;--input-bg:#fbfcfe;--panel-bg:#fff;--body-bg:#F3F5F9}
[data-theme="dark"]{--bg:#0d1117;--card:#1a2332;--border:#2d3748;--text:#e8edf5;--muted:#8892a6;--topbar-bg:#0a0f1a;--input-bg:#0f1620;--panel-bg:#131a26;--body-bg:#0d1117}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',sans-serif;background:var(--body-bg);color:var(--text);transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit}
.hidden{display:none!important}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes checkDraw{0%{stroke-dashoffset:100}100%{stroke-dashoffset:0}}
@keyframes checkScale{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes checkFadeOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
@keyframes circleExpand{0%{transform:scale(0);opacity:.6}100%{transform:scale(1);opacity:0}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
#success-overlay{position:fixed;inset:0;z-index:99998;pointer-events:none;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);animation:fadeIn .25s}
#success-overlay.show{display:flex}
#success-overlay .check-circle{width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(16,185,129,.6),0 0 0 8px rgba(16,185,129,.15);animation:checkScale .5s cubic-bezier(.34,1.56,.64,1) forwards;position:relative}
#success-overlay .check-circle::before{content:'';position:absolute;inset:-20px;border-radius:50%;border:3px solid #10b981;opacity:.6;animation:circleExpand 1s ease-out infinite}
#success-overlay .check-circle::after{content:'';position:absolute;inset:-40px;border-radius:50%;border:2px solid #10b981;opacity:.4;animation:circleExpand 1s ease-out .3s infinite}
#success-overlay .check-svg{width:80px;height:80px}
#success-overlay .check-svg path{stroke:#fff;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:checkDraw .4s ease-out .25s forwards}
#success-overlay .success-text{position:absolute;bottom:-60px;left:50%;transform:translateX(-50%);color:#fff;font-weight:900;font-size:18px;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.5);animation:fadeIn .4s ease-out .4s both}
#success-overlay.fade-out .check-circle{animation:checkFadeOut .3s forwards}
#progress-bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--orange),var(--purple),var(--orange));background-size:50px 50px;width:0%;z-index:99999;box-shadow:0 0 12px var(--orange);transition:width .1s linear;overflow:hidden}
#progress-bar::after{content:'';position:absolute;right:0;top:0;bottom:0;width:100px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shimmer 1s linear infinite}
#live-clocks{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.1);padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.2);font-size:11.5px;font-weight:800}
#live-clocks .clock{display:flex;align-items:center;gap:4px;white-space:nowrap}
#live-clocks .clock .flag{font-size:14px}
#live-clocks .clock .time{color:#fff;font-family:'Courier New',monospace;letter-spacing:.5px}
#live-clocks .clock .label{color:#93c5fd;font-size:10px}
@media(max-width:900px){#live-clocks{width:100%;order:5;justify-content:center}}
#login-screen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 30%,rgba(249,115,22,.15),transparent 50%),radial-gradient(circle at 80% 70%,rgba(109,40,217,.15),transparent 50%),linear-gradient(135deg,#0a0f1a 0%,#0d1117 50%,#0a0f1a 100%);overflow:hidden}
#login-screen.hidden{display:none}
.login-card{position:relative;z-index:2;width:min(440px,92vw);background:linear-gradient(135deg,rgba(26,35,50,.95),rgba(22,27,34,.98));backdrop-filter:blur(20px);border:1px solid rgba(249,115,22,.2);border-radius:24px;padding:44px 36px 36px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:scaleIn .6s}
.login-card::before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--orange),var(--purple),transparent);border-radius:24px 24px 0 0;animation:gradient 3s ease infinite;background-size:200% 100%}
.login-logo{width:120px;height:120px;margin:0 auto 22px;border-radius:22px;background:#fff;padding:8px;border:3px solid var(--orange);box-shadow:0 12px 40px rgba(249,115,22,.25);animation:float 3s ease-in-out infinite;display:flex;align-items:center;justify-content:center;overflow:hidden}
.login-logo img{width:100%;height:100%;object-fit:contain;border-radius:14px}
.login-title{text-align:center;font-size:26px;font-weight:900;color:#fff;margin-bottom:6px}
.login-sub{text-align:center;font-size:13px;color:#8892a6;margin-bottom:32px;font-weight:500}
.login-input-group{margin-bottom:18px}
.login-input-group label{display:block;font-size:12px;font-weight:700;color:#8892a6;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.login-input{width:100%;padding:15px 18px;font-size:16px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:12px;color:#fff;transition:all .25s;font-weight:600;text-align:center}
.login-input:focus{outline:none;border-color:var(--orange);background:rgba(0,0,0,.5);box-shadow:0 0 0 4px rgba(249,115,22,.15)}
.login-input::placeholder{color:rgba(255,255,255,.25);font-weight:400}
.login-input.code{font-family:'Courier New',monospace;font-size:22px;letter-spacing:6px;font-weight:900}
.login-btn{width:100%;padding:16px;margin-top:10px;background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;border-radius:12px;font-weight:900;font-size:15px;transition:all .25s;box-shadow:0 8px 28px rgba(249,115,22,.35)}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(249,115,22,.5)}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.login-error{margin-top:16px;padding:12px 16px;background:rgba(224,67,58,.15);border:1px solid rgba(224,67,58,.3);color:#ff8b82;border-radius:10px;font-size:13px;font-weight:600;text-align:center;animation:shake .4s}
.login-footer{text-align:center;font-size:11px;color:#8892a6;margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,.05)}
#topbar{background:var(--topbar-bg);color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.15);border-bottom:2px solid var(--orange);flex-wrap:wrap;transition:background .3s}
.topbar-brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#fff}
.topbar-brand .logo-wrap{width:40px;height:40px;border-radius:10px;background:#fff;padding:3px;border:2px solid var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.topbar-brand .logo-wrap img{width:100%;height:100%;object-fit:contain;border-radius:6px}
.topbar-brand-text .t1{font-size:15px;color:#fff}
.topbar-brand-text .t2{font-size:10px;color:#93c5fd;font-weight:600}
.topbar-nav{display:flex;gap:4px;flex-wrap:wrap}
.topbar-nav button{background:transparent;color:#cdd6ea;padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;transition:all .2s}
.topbar-nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.topbar-nav button.active{background:var(--orange);color:#fff}
.topbar-user{display:flex;align-items:center;gap:8px}
.user-badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);padding:4px 12px 4px 4px;border-radius:30px;border:1px solid rgba(255,255,255,.15)}
.user-avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--orange),var(--orange-2));display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:14px;flex-shrink:0}
.user-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.user-info .name{font-size:12px;font-weight:800;color:#fff;line-height:1.2}
.user-info .role{font-size:9px;color:#93c5fd;font-weight:600}
.logout-btn{background:rgba(224,67,58,.2);color:#ff8b82;border:1px solid rgba(224,67,58,.4);padding:7px 14px;border-radius:20px;font-weight:700;font-size:11.5px;transition:all .2s}
.logout-btn:hover{background:rgba(224,67,58,.35);color:#fff}
.theme-toggle-btn,.sound-toggle-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25);transition:all .2s}
.theme-toggle-btn:hover,.sound-toggle-btn:hover{background:var(--orange);border-color:var(--orange);transform:rotate(20deg)}
.sound-toggle-btn.muted{opacity:.5}
@media(max-width:700px){.topbar-nav{width:100%;order:3;overflow-x:auto;padding-bottom:4px}.user-info{display:none}}
#app{max-width:1180px;margin:0 auto;padding:24px 18px 80px}
.page-title{font-size:24px;font-weight:900;color:var(--navy);margin:0 0 4px;display:flex;align-items:center;gap:10px}
[data-theme="dark"] .page-title{color:var(--orange)}
.page-title-emoji{font-size:28px}
.page-sub{color:var(--muted);font-size:13.5px;margin:0 0 20px}
.next-number-banner{background:linear-gradient(135deg,#0B1F4D 0%,#132a63 50%,#0B1F4D 100%);border-radius:20px;padding:28px 24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;box-shadow:0 20px 50px rgba(11,31,77,.25);position:relative;overflow:hidden;border:2px solid var(--orange);animation:scaleIn .5s}
.next-number-content{position:relative;z-index:2}
.next-number-label{font-size:13px;color:#F97316;font-weight:700;margin-bottom:8px;letter-spacing:1px}
.next-number-value{font-size:42px;font-weight:900;color:#fff;font-family:'Courier New',monospace;letter-spacing:2px;text-shadow:0 4px 20px rgba(249,115,22,.4);transition:transform .3s}
.next-number-actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:2}
.welcome-banner{background:linear-gradient(135deg,rgba(249,115,22,.15),rgba(109,40,217,.15));border:1px solid rgba(249,115,22,.3);border-radius:20px;padding:24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.welcome-title{font-size:24px;font-weight:900;color:var(--navy);margin-bottom:6px}
[data-theme="dark"] .welcome-title{color:#fff}
.welcome-sub{font-size:13px;color:var(--muted);font-weight:600}
.welcome-stats{display:flex;gap:14px;flex-wrap:wrap}
.welcome-stat{text-align:center;background:rgba(255,255,255,.7);padding:10px 16px;border-radius:12px;border:1px solid rgba(249,115,22,.3)}
[data-theme="dark"] .welcome-stat{background:rgba(0,0,0,.3)}
.welcome-stat-v{font-size:22px;font-weight:900;color:var(--orange)}
.welcome-stat-l{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--panel-bg);border:1px solid var(--border);border-radius:16px;padding:18px;position:relative;overflow:hidden;transition:all .3s}
.stat-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.1)}
.stat-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--c,var(--orange)),rgba(249,115,22,.2));display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px;color:#fff}
.stat-value{font-size:26px;font-weight:900;color:var(--navy);line-height:1;margin-bottom:6px;letter-spacing:-1px}
[data-theme="dark"] .stat-value{color:#fff}
.stat-label{font-size:12px;color:var(--muted);font-weight:600}
.panel{background:var(--panel-bg);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:18px}
.panel h4{margin:0 0 14px;color:var(--navy);font-size:14.5px;font-weight:900;border-bottom:2px solid var(--border);padding-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
[data-theme="dark"] .panel h4{color:var(--orange)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.doc-card{background:var(--panel-bg);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:.15s;cursor:pointer;position:relative;overflow:hidden}
.doc-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(11,31,77,.12);border-color:var(--orange)}
.doc-card .icon{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:var(--orange);display:flex;align-items:center;justify-content:center;font-size:20px}
.doc-card h3{margin:0;font-size:15px;color:var(--navy)}
[data-theme="dark"] .doc-card h3{color:#fff}
.doc-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.doc-card .go{position:absolute;left:14px;bottom:14px;color:var(--orange);font-weight:700;font-size:12px}
.form-wrap{display:grid;grid-template-columns:1.05fr 1.35fr;gap:18px;align-items:start}
@media(max-width:980px){.form-wrap{grid-template-columns:1fr}}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--input-bg);color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--orange)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field textarea{resize:vertical;min-height:56px}
.items-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
.items-table th{background:var(--navy);color:#fff;padding:8px 6px;font-size:11.5px;font-weight:700}
.items-table td{padding:5px 4px;border:1px solid var(--border)}
.items-table td input{border:none;background:transparent;width:100%;padding:6px 4px;font-size:13px;text-align:center;color:var(--text)}
.items-table td input:focus{outline:2px solid var(--orange);border-radius:4px}
.items-table .rm{background:#fde2e1;color:var(--red);border-radius:6px;width:26px;height:26px;font-weight:900}
.add-row-btn{margin-top:10px;background:var(--bg);color:var(--navy);padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;border:1px solid var(--border)}
[data-theme="dark"] .add-row-btn{color:var(--orange)}
.btn-primary{background:var(--orange);color:#fff;padding:10px 18px;border-radius:9px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn-secondary{background:var(--navy);color:#fff;padding:10px 18px;border-radius:9px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn-pdf{background:#b91c1c;color:#fff;padding:10px 18px;border-radius:9px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn-ghost{background:var(--panel-bg);color:var(--navy);border:1px solid var(--border);padding:9px 16px;border-radius:9px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
[data-theme="dark"] .btn-ghost{color:#fff}
.btn-whatsapp{background:var(--whatsapp);color:#fff;padding:10px 18px;border-radius:9px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn-whatsapp.disabled{background:#ccc;color:#666;cursor:not-allowed}
.btn-exec-lg{background:#6d28d9;color:#fff;padding:10px 18px;border-radius:9px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn-exec{background:#6d28d9;color:#fff;padding:6px 10px;border-radius:6px;font-weight:800;font-size:11.5px;display:inline-flex;align-items:center;gap:4px}
.btn-copy{background:#0891b2;color:#fff;padding:6px 10px;border-radius:6px;font-weight:800;font-size:11.5px;display:inline-flex;align-items:center;gap:4px}
.btn-sm{padding:6px 11px;font-size:11.5px;border-radius:8px}
.preview-toggles{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:12px}
.preview-toggles .tg-label{font-size:12px;font-weight:800;color:var(--muted);margin-left:4px}
.toggle-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:800;border:1.5px solid var(--border);background:var(--panel-bg);color:var(--muted);transition:all .2s}
.toggle-btn:hover{border-color:var(--orange)}
.toggle-btn.on{background:rgba(30,158,90,.12);border-color:var(--green);color:var(--green)}
.toggle-btn.off{background:rgba(224,67,58,.1);border-color:var(--red);color:var(--red)}
.toggle-btn .tg-icon{font-size:14px}
@media(max-width:700px){.preview-toggles{justify-content:center}}
.actions-bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.doc-sheet{background:#fff!important;color:#000!important;width:100%;max-width:850px;margin:0 auto;border:1px solid #E3E7EE;border-radius:10px;overflow:hidden;box-shadow:0 6px 24px rgba(11,31,77,.08);position:relative}
.watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.10;pointer-events:none;z-index:10;width:80%;max-width:700px}
.watermark img{width:100%;height:auto;display:block}
.doc-header{background:#fff;padding:18px 26px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #eee;gap:20px;position:relative;z-index:2}
.doc-header .logo-img{height:120px;width:auto;border-radius:10px;object-fit:contain;background:#fff;padding:5px;border:1px solid #ddd;display:block}
.doc-header .doc-badge{background:linear-gradient(135deg,#0B1F4D,#132a63);color:#fff;border-radius:12px;padding:14px 22px;text-align:center;min-width:160px;border:2px solid #F97316;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.doc-header .doc-badge .t{font-size:14px;color:#cdd6ea;margin-bottom:3px}
.doc-header .doc-badge .big{font-size:24px;font-weight:900;color:#F97316}
.doc-header .company-info{flex:1;text-align:center;padding:0 15px}
.doc-header .company-info .tag{color:#F97316;font-weight:700;font-size:14px;margin-bottom:2px}
.doc-header .company-info h1{margin:0;color:#0B1F4D;font-size:26px;font-weight:900;line-height:1.3}
.doc-header .company-info h1 span{font-size:18px;color:#F97316;display:block;margin-top:2px}
.doc-header .company-info .slogan{font-size:14px;color:#7A8296;border-top:2px solid #f0f0f0;padding-top:5px;margin-top:4px}
.doc-title-strip{padding:0 26px 12px;border-bottom:1px solid #eee;position:relative;z-index:2}
.doc-title-strip h2{margin:10px 0 2px;font-size:30px;font-weight:900;color:#0B1F4D;border-bottom:4px solid #F97316;display:inline-block;padding-bottom:4px}
.doc-title-strip .subtitle{color:#7A8296;font-size:15px;margin-top:2px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 26px 12px;position:relative;z-index:2}
.info-box{border:1px solid #E3E7EE;border-radius:8px;padding:12px 16px}

function playSound(type) {

    });
  } catch (e) {}
}

async function commitDocNumber() {
  // nextNumber stores the NEXT available sequence. The transaction increments it
  // atomically, so two employees saving at the same moment cannot receive one number.
  const start = Math.max(1, parseInt(SETTINGS.startNumber, 10) || 1);
  const year = String(SETTINGS.year || new Date().getFullYear());
  const highestExisting = DOCS.reduce((max, d) => {
    const match = String(d.number || '').match(new RegExp('^Q-' + year + '-(\\d+)$'));
    return match ? Math.max(max, parseInt(match[1], 10) || 0) : max;
  }, start - 1);
  try {
    const result = await runTransaction(child(metaRef, 'nextNumber'), (current) => {
      const nextAvailable = Math.max(
        current === null || current === undefined ? start : (parseInt(current, 10) || start),
        highestExisting + 1
      );
      return nextAvailable + 1;
    });
    if (!result.committed || !Number.isFinite(Number(result.snapshot.val()))) {
      throw new Error('لم يتم اعتماد رقم المستند في قاعدة البيانات');
    }
    const allocated = Number(result.snapshot.val()) - 1;
    SETTINGS.nextNumber = allocated + 1;
    CURRENT_NEXT_NUMBER = 'Q-' + year + '-' + String(allocated + 1).padStart(3, '0');
    const el = document.getElementById('next-number-display');
    if (el) el.textContent = CURRENT_NEXT_NUMBER;
    return allocated;
  } catch (error) {
    console.error('commitDocNumber error:', error);
    toast('تعذر حجز رقم موحّد من قاعدة البيانات. لم يتم حفظ المستند لتجنب تكرار الرقم.', 'error');
    throw error;
  }
}

function numberToArabicWords(num) {
  num = Math.floor(Number(num) || 0); if (num === 0) return 'صفر ريال سعودي فقط لا غير';
  const ones = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
  const tens = ['', 'عشرة', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
  const hundreds = ['', 'مائة', 'مئتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
  function td(n) { let s = ''; const h = Math.floor(n / 100), r = n % 100; if (h > 0) s += hundreds[h]; if (r > 0) { if (s) s += ' و'; if (r < 20) s += ones[r]; else { const t = Math.floor(r / 10), o = r % 10; s += (o > 0 ? ones[o] + ' و' : '') + tens[t]; } } return s; }
  function g(n, s, d, p) { if (n === 0) return ''; if (n === 1) return s; if (n === 2) return d; if (n >= 3 && n <= 10) return td(n) + ' ' + p; return td(n) + ' ' + s; }
  const m = Math.floor(num / 1000000), th = Math.floor((num % 1000000) / 1000), rest = num % 1000;
  let parts = []; if (m > 0) parts.push(g(m, 'مليون', 'مليونان', 'ملايين')); if (th > 0) parts.push(g(th, 'ألف', 'ألفان', 'آلاف')); if (rest > 0) parts.push(td(rest));
  return (parts.filter(Boolean).join(' و') || 'صفر') + ' ريال سعودي فقط لا غير';
}

function calculateItem(item, taxPercent, triggeredField, type) {
  const tax = safeNumber(taxPercent); const factor = 1 + (tax / 100);
  let qty = safeNumber(item.qty); if (qty <= 0) qty = 1;
  if (type && type.isPrecast) {
    let uW = safeNumber(item.unitPriceWithoutTax), uT = safeNumber(item.unitPriceWithTax), tT = safeNumber(item.totalWithTax);
    if (triggeredField === 'qty' || triggeredField === 'unitPriceWithoutTax') { const tb = roundToTwo(qty * uW); tT = roundToTwo(tb + roundToTwo(tb * (tax / 100))); uT = roundToTwo(uW * factor); }
    else if (triggeredField === 'unitPriceWithTax') { if (uT > 0) { uW = roundToTwo(uT / factor); const tb = roundToTwo(qty * uW); tT = roundToTwo(tb + roundToTwo(tb * (tax / 100))); } }
    else if (triggeredField === 'totalWithTax') { if (tT > 0) { const tb = roundToTwo(tT / factor); uW = roundToTwo(tb / qty); uT = roundToTwo(uW * factor); } }
    item.qty = qty; item.unitPriceWithoutTax = uW; item.unitPriceWithTax = uT; item.totalWithTax = tT; return;
  }
  let price = safeNumber(item.price), priceT = safeNumber(item.priceWithTax), tT = safeNumber(item.totalWithTax);
  if (triggeredField === 'qty' || triggeredField === 'price') { const tb = roundToTwo(qty * price); tT = roundToTwo(tb + roundToTwo(tb * (tax / 100))); priceT = roundToTwo(price * factor); }
  else if (triggeredField === 'priceWithTax') { if (priceT > 0) { price = roundToTwo(priceT / factor); const tb = roundToTwo(qty * price); tT = roundToTwo(tb + roundToTwo(tb * (tax / 100))); } }
  else if (triggeredField === 'totalWithTax') { if (tT > 0) { const tb = roundToTwo(tT / factor); price = roundToTwo(tb / qty); priceT = roundToTwo(price * factor); } }
  item.qty = qty; item.price = price; item.priceWithTax = priceT; item.totalWithTax = tT;
}

function recalcConcreteFull(doc, triggeredItem, triggeredField, taxPercent) {
  const tax = safeNumber(taxPercent) || 15; const factor = 1 + (tax / 100); const ROW_DIFF = 10; const OPC_SRC_DIFF = 5;
  const items = doc.items || []; const idx = items.findIndex(x => x.id === triggeredItem.id); if (idx === -1) return;
  const baseVal = safeNumber(triggeredItem[triggeredField]);
  if (baseVal <= 0) { items.forEach(it => { it.priceWithTaxOPC = 0; it.priceWithTaxSRC = 0; it.priceWithoutTaxOPC = 0; it.priceWithoutTaxSRC = 0; }); return; }
  let opcWithTaxAtIndex;
  if (triggeredField === 'priceWithTaxOPC') opcWithTaxAtIndex = baseVal;
  else if (triggeredField === 'priceWithTaxSRC') opcWithTaxAtIndex = baseVal - OPC_SRC_DIFF;
  else if (triggeredField === 'priceWithoutTaxOPC') opcWithTaxAtIndex = baseVal * factor;
  else if (triggeredField === 'priceWithoutTaxSRC') opcWithTaxAtIndex = (baseVal * factor) - OPC_SRC_DIFF;
  else return;
  if (opcWithTaxAtIndex < 0) opcWithTaxAtIndex = 0;
  items.forEach((it, i) => {
    const offset = (i - idx) * ROW_DIFF; const opcWithTax = Math.max(0, opcWithTaxAtIndex + offset);
    it.priceWithTaxOPC = roundToTwo(opcWithTax); it.priceWithoutTaxOPC = roundToTwo(opcWithTax / factor);
    const srcWithTax = opcWithTax + OPC_SRC_DIFF; it.priceWithTaxSRC = roundToTwo(srcWithTax); it.priceWithoutTaxSRC = roundToTwo(srcWithTax / factor);
  });
  if (triggeredField === 'priceWithTaxOPC') triggeredItem.priceWithTaxOPC = baseVal;
  else if (triggeredField === 'priceWithTaxSRC') triggeredItem.priceWithTaxSRC = baseVal;
  else if (triggeredField === 'priceWithoutTaxOPC') triggeredItem.priceWithoutTaxOPC = baseVal;
  else if (triggeredField === 'priceWithoutTaxSRC') triggeredItem.priceWithoutTaxSRC = baseVal;
}

function updateRowCells(tr, item, t, taxPercent) {
  const tax = safeNumber(taxPercent); const active = document.activeElement;
  if (t.isConcreteFull) {
    ['priceWithTaxOPC', 'priceWithTaxSRC', 'priceWithoutTaxOPC', 'priceWithoutTaxSRC'].forEach(f => { const inp = tr.querySelector(`[data-if="${f}"]`); if (inp && inp !== active) inp.value = (item[f] !== undefined && item[f] !== null && item[f] !== '') ? item[f] : ''; });
    ['code', 'cementContent'].forEach(f => { const inp = tr.querySelector(`[data-if="${f}"]`); if (inp && inp !== active) inp.value = item[f] || ''; });
    return;
  }
  const isPrecast = !!t.isPrecast; const qty = safeNumber(item.qty) || 0;
  const price = isPrecast ? safeNumber(item.unitPriceWithoutTax) : safeNumber(item.price);
  const priceT = isPrecast ? safeNumber(item.unitPriceWithTax) : safeNumber(item.priceWithTax);
  const beforeTax = roundToTwo(qty * price); const taxAmt = roundToTwo(beforeTax * (tax / 100)); const totalWithTax = roundToTwo(beforeTax + taxAmt);
  const qtyInput = tr.querySelector('[data-if="qty"]'); if (qtyInput && qtyInput !== active) qtyInput.value = qty || '';
  const priceInput = tr.querySelector(isPrecast ? '[data-if="unitPriceWithoutTax"]' : '[data-if="price"]'); if (priceInput && priceInput !== active) priceInput.value = price || '';
  const priceTInput = tr.querySelector(isPrecast ? '[data-if="unitPriceWithTax"]' : '[data-if="priceWithTax"]'); if (priceTInput && priceTInput !== active) priceTInput.value = priceT || '';
  const totalInput = tr.querySelector('[data-if="totalWithTax"]'); if (totalInput && totalInput !== active) totalInput.value = totalWithTax || '';
  const taxCell = tr.querySelectorAll('td')[6]; if (taxCell) taxCell.textContent = money(taxAmt);
}

function computeTotals(doc) {
  const t = TYPES[doc.type];
  if (!t || t.kind !== 'quote') return { subtotal: 0, vat: 0, grand: 0, discount: 0, grandBeforeDiscount: 0 };
  if (t.isConcreteFull) return { subtotal: 0, vat: 0, grand: 0, discount: 0, grandBeforeDiscount: 0 };
  const tax = safeNumber(doc.taxPercent || 15); let s = 0, v = 0;
  (doc.items || []).forEach(it => {
    let beforeTax = 0;
    if (t.isPrecast) beforeTax = roundToTwo(safeNumber(it.qty) * safeNumber(it.unitPriceWithoutTax));
    else beforeTax = roundToTwo(safeNumber(it.qty) * safeNumber(it.price));
    s += beforeTax; v += roundToTwo(beforeTax * (tax / 100));
  });
  const subtotal = roundToTwo(s), vat = roundToTwo(v); const grandBeforeDiscount = roundToTwo(subtotal + vat);
  const discount = Math.min(roundToTwo(safeNumber(doc.discountAmount || 0)), grandBeforeDiscount);
  const grand = roundToTwo(grandBeforeDiscount - discount);
  return { subtotal, vat, grand, discount, grandBeforeDiscount };
}

function exportPdf(element, defaultName) {
  if (!element) { toast('❌ لم يتم العثور على المستند', 'error'); return; }
  const fileName = prompt('أدخل اسم ملف PDF:', defaultName);
  if (fileName === null) return;
  const finalName = (fileName.trim() || defaultName).replace(/[\\/:*?"<>|]/g, '-');
  startProgress(4000); toast('⏳ جاري تجهيز PDF...', 'info');
  const opt = { margin: [5, 5, 5, 5], filename: finalName + '.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 3, useCORS: true, letterRendering: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
  html2pdf().set(opt).from(element).save().then(() => { finishProgress(); showSuccessCheck('تم تحميل PDF', 1500); }).catch((err) => { console.error('PDF error:', err); finishProgress(); toast('❌ خطأ في إنشاء PDF', 'error'); });
}
function renderViewPage(id) {
  const doc = DOCS.find(d => d.id === id);
  if (!doc) { document.getElementById('app').innerHTML = '<div class="panel" style="text-align:center;padding:40px;">المستند غير موجود</div>'; return; }
  if (!canSeeDoc(doc)) { toast('❌ لا يمكنك معاينة هذا المستند', 'error'); navigate('archive'); return; }
  const t = TYPES[doc.type];
  if (!t) { document.getElementById('app').innerHTML = '<div class="panel" style="text-align:center;padding:40px;">نوع المستند غير معروف</div>'; return; }
  window._activePreviewDoc = doc;
  const html = t.kind === 'quote' ? quotePreview(t, doc) : receiptPreview(doc);
  const whatsappLink = getWhatsAppLink(doc);
  const hasContact = doc.contact && doc.contact.replace(/[\s\-\(\)]/g, '').length > 0;
  const isMine = true;
  let receiptBtn = '';
  if (t.kind === 'quote' && doc.paymentMethod === 'نقدي') {
    const linkedReceipt = DOCS.find(d => d.type === 'receipt' && d.linkedQuoteId === doc.id);
    if (linkedReceipt) receiptBtn = `<button class="btn-primary" id="go-to-receipt">📄 سند استلام</button>`;
  }

    execBtn = hasExec ? `<button class="btn-exec-lg" id="go-to-exec">📋 معاينة أمر التنفيذ</button>` : `<button class="btn-exec-lg" id="create-exec">📋 إنشاء أمر التنفيذ</button>`;
  }
  document.getElementById('app').innerHTML = `
    <div class="actions-bar" style="margin-bottom:10px;">

      <button class="btn-secondary" id="do-print">🖨️ طباعة مباشرة</button>

  document.getElementById('do-download-pdf').onclick = () => { const element = document.querySelector('#print-area .doc-sheet'); exportPdf(element, doc.number + ' - ' + (doc.customerName || doc.receivedFrom || 'مستند')); };
  document.getElementById('do-print').onclick = () => window.print();
  const editBtn = document.getElementById('do-edit'); if (editBtn) editBtn.onclick = () => navigate('form', { type: doc.type, id: doc.id });
  const dupBtn = document.getElementById('do-duplicate'); if (dupBtn) dupBtn.onclick = () => duplicateDoc(doc.id);
  document.getElementById('back-archive').onclick = () => navigate('archive');

  if (goToReceiptBtn) goToReceiptBtn.onclick = () => { const linkedReceipt = DOCS.find(d => d.type === 'receipt' && d.linkedQuoteId === doc.id); if (linkedReceipt) navigate('view', { id: linkedReceipt.id }); else toast('❌ السند غير موجود', 'error'); };

function renderForm(type, id) {
  const t = TYPES[type];
  if (!t) { document.getElementById('app').innerHTML = '<p>نوع غير معروف</p>'; return; }
  let doc;
  if (id === 'new') {
    if (window._currentDoc && window._currentDoc.type === type) doc = window._currentDoc;
    else doc = blankDoc(type);
  } else {
    const existing = DOCS.find(d => d.id === id);
    if (!existing) { toast('❌ غير موجود', 'error'); navigate('archive'); return; }
    
    const pwd = prompt('🔒 أدخل باسورد التعديل:');
    if (pwd === null) { navigate('archive'); return; }
    if (pwd !== (SETTINGS.editPassword || 'edit123')) { toast('❌ باسورد غير صحيح', 'error'); logActivity('security', `محاولة تعديل فاشلة ${existing.number}`); navigate('archive'); return; }
    doc = { ...existing };
    doc.notesList = normalizeNotes(doc);
  }
  window._currentDoc = doc;
  window._currentType = type;
  window._activePreviewDoc = doc;
  document.getElementById('app').innerHTML = `
    <h1 class="page-title">${t.icon || '📄'} ${escapeHtml(t.title)}</h1>
    <p class="page-sub">رقم المستند: <b style="color:var(--orange)">${escapeHtml(doc.number)}</b></p>
    <div class="form-wrap">
      <div id="form-panels">${t.kind === 'quote' ? quoteFormPanels(t, doc) : receiptFormPanels(doc)}</div>
      <div>
        ${previewTogglesBar(doc)}
        <div class="panel" style="padding:14px;">
          <h4>👁️ معاينة حية</h4>
          <div id="preview">${t.kind === 'quote' ? quotePreview(t, doc) : receiptPreview(doc)}</div>
        </div>
      </div>
    </div>
  `;
  bindForm(type, doc);
}

function blankDoc(type) {
  const t = TYPES[type];
  const fixedVals = SETTINGS.fixedValues || DEFAULT_SETTINGS.fixedValues;
  const fixedFields = SETTINGS.fixedFields || DEFAULT_SETTINGS.fixedFields;
  const base = { id: uid(), type, number: nextDocNumber(), createdAt: Date.now(), createdBy: CURRENT_USER.id, createdByName: CURRENT_USER.name, status: 'pending', date: todayStr(), showNumber: true, showTotal: true, showBank: true };
  if (t.kind === 'quote') {
    let extraFields = {};
    if (t.isPrecast) extraFields = { size: '', unitPriceWithoutTax: 0, unitPriceWithTax: 0 };
    return { ...base,
      customerName: '', contact: '',
      taxNumberClient: fixedFields.taxNumberClient ? (fixedVals.taxNumberClient || '') : '',
      paymentMethod: fixedFields.paymentMethod ? (fixedVals.paymentMethod || '') : '',
      location: fixedFields.location ? (fixedVals.location || '') : '',
      project: fixedFields.project ? (fixedVals.project || '') : '',
      materialType: fixedFields.materialType ? (fixedVals.materialType || '') : '',
      taxPercent: fixedFields.taxPercent ? (fixedVals.taxPercent || 15) : 15,
      workDescription: fixedFields.workDescription ? (fixedVals.workDescription || '') : '',
      preparedBy: fixedFields.preparedBy ? (fixedVals.preparedBy || '') : '',
      location2: fixedFields.location2 ? (fixedVals.location2 || '') : '',
      priceTerms: '', deliveryTerms: '', notesList: [], discountReason: '', discountAmount: 0,
      items: [emptyItem(t)], ...extraFields
    };
  }
  return { ...base, receivedFrom: '', amount: '', amountFor: '', paymentMethod: 'تحويل بنكي', txnRef: '', bankName: '', notesList: [], receiverName: '', receiverDate: todayStr(), payerName: '', payerDate: todayStr() };
}

function emptyItem(t) {
  if (t.isPrecast) return { id: uid(), desc: '', size: '', qty: 1, unitPriceWithoutTax: 0, unitPriceWithTax: 0, totalWithTax: 0 };
  if (t.isBlock) return { id: uid(), desc: '', size: '', unit: '', qty: 1, price: 0, priceWithTax: 0, totalWithTax: 0 };
  if (t.isConcreteFull) return { id: uid(), code: '', cementContent: '', priceWithTaxOPC: 0, priceWithTaxSRC: 0, priceWithoutTaxOPC: 0, priceWithoutTaxSRC: 0 };
  return { id: uid(), desc: '', unit: '', qty: 1, price: 0, priceWithTax: 0, totalWithTax: 0 };
}

function itemRow(it, i, t, taxPercent) {
  const tax = safeNumber(taxPercent);
  if (t.isConcreteFull) {
    return `<tr data-id="${it.id}"><td>${i+1}</td>
      <td><input data-if="code" value="${escapeHtml(it.code || '')}" style="text-align:center;font-weight:700;"></td>
      <td><input data-if="cementContent" value="${escapeHtml(it.cementContent || '')}" style="text-align:center;"></td>
      <td><input data-if="priceWithTaxOPC" value="${escapeHtml(it.priceWithTaxOPC || '')}" style="text-align:center;color:var(--orange);font-weight:700;"></td>
      <td><input data-if="priceWithTaxSRC" value="${escapeHtml(it.priceWithTaxSRC || '')}" style="text-align:center;color:var(--orange);font-weight:700;"></td>
      <td><input data-if="priceWithoutTaxOPC" value="${escapeHtml(it.priceWithoutTaxOPC || '')}" style="text-align:center;"></td>
      <td><input data-if="priceWithoutTaxSRC" value="${escapeHtml(it.priceWithoutTaxSRC || '')}" style="text-align:center;"></td>
      <td><button class="rm" data-rm="${it.id}" type="button">×</button></td></tr>`;
  }
  if (t.isPrecast) {
    const qty = safeNumber(it.qty) || 0; const uW = safeNumber(it.unitPriceWithoutTax); const uT = safeNumber(it.unitPriceWithTax) || roundToTwo(uW * (1 + tax / 100));
    const tb = roundToTwo(qty * uW); const ta = roundToTwo(tb * (tax / 100)); const tT = roundToTwo(tb + ta);
    return `<tr data-id="${it.id}"><td>${i+1}</td>
      <td><input data-if="desc" value="${escapeHtml(it.desc || '')}" style="text-align:right;"></td>
      <td><input data-if="size" value="${escapeHtml(it.size || '')}" style="text-align:center;"></td>
      <td><input data-if="qty" type="text" value="${qty || ''}" style="text-align:center;"></td>
      <td><input data-if="unitPriceWithoutTax" type="text" value="${uW || ''}" style="text-align:center;"></td>
      <td><input data-if="unitPriceWithTax" type="text" value="${uT || ''}" style="text-align:center;color:var(--orange);font-weight:700;"></td>
      <td style="color:var(--green);font-weight:700;">${money(ta)}</td>
      <td><input data-if="totalWithTax" type="text" value="${tT || ''}" style="font-weight:800;color:var(--navy);text-align:center;"></td>
      <td><button class="rm" data-rm="${it.id}" type="button">×</button></td></tr>`;
  }
  if (t.isBlock) {
    const qty = safeNumber(it.qty) || 0; const price = safeNumber(it.price); const pT = safeNumber(it.priceWithTax) || roundToTwo(price * (1 + tax / 100));
    const tb = roundToTwo(qty * price); const ta = roundToTwo(tb * (tax / 100)); const tT = roundToTwo(tb + ta);
    return `<tr data-id="${it.id}"><td>${i+1}</td>
      <td><input data-if="desc" value="${escapeHtml(it.desc || '')}" style="text-align:right;"></td>
      <td><input data-if="size" value="${escapeHtml(it.size || '')}" style="text-align:center;"></td>
      <td><input data-if="qty" type="text" value="${qty || ''}" style="text-align:center;"></td>
      <td><input data-if="price" type="text" value="${price || ''}" style="text-align:center;"></td>
      <td><input data-if="priceWithTax" type="text" value="${pT || ''}" style="text-align:center;color:var(--orange);font-weight:700;"></td>
      <td style="color:var(--green);font-weight:700;">${money(ta)}</td>
      <td><input data-if="totalWithTax" type="text" value="${tT || ''}" style="font-weight:800;color:var(--navy);text-align:center;"></td>
      <td><button class="rm" data-rm="${it.id}" type="button">×</button></td></tr>`;
  }
  const qty = safeNumber(it.qty) || 0; const price = safeNumber(it.price); const pT = safeNumber(it.priceWithTax) || roundToTwo(price * (1 + tax / 100));

  return `<tr data-id="${it.id}"><td>${i+1}</td>
    <td><input data-if="desc" value="${escapeHtml(it.desc || '')}" style="text-align:right;"></td>

    <td><input data-if="totalWithTax" type="text" value="${tT || ''}" style="font-weight:800;color:var(--navy);text-align:center;"></td>
    <td><button class="rm" data-rm="${it.id}" type="button">×</button></td></tr>`;
}

function bindForm(type, doc) {
  const t = TYPES[type];
  const formPanels = document.getElementById('form-panels');
  if (!formPanels) return;
  if (!doc.notesList) doc.notesList = normalizeNotes(doc);

  function refreshPreview() {
    const el = document.getElementById('preview');
    if (el) el.innerHTML = t.kind === 'quote' ? quotePreview(t, doc) : receiptPreview(doc);
    updateToggleButtonsUI(doc);
  }
  function handleFieldChange(target) {
    const f = target.dataset.f;
    if (f) {
      if (f === 'discountAmount' || f === 'taxPercent' || f === 'amount') doc[f] = safeNumber(target.value);
      else doc[f] = target.value;
      refreshPreview(); return true;
    }
    const ifld = target.dataset.if; if (!ifld) return false;
    const tr = target.closest('tr'); if (!tr) return false;
    const item = doc.items.find(x => x.id === tr.dataset.id); if (!item) return false;
    const numericFields = ['qty', 'price', 'priceWithTax', 'totalWithTax', 'unitPriceWithoutTax', 'unitPriceWithTax', 'priceWithTaxOPC', 'priceWithTaxSRC', 'priceWithoutTaxOPC', 'priceWithoutTaxSRC'];
    if (numericFields.includes(ifld)) item[ifld] = inputToNumber(target.value); else item[ifld] = target.value;
    if (t.isConcreteFull) {
      if (numericFields.includes(ifld)) {
        recalcConcreteFull(doc, item, ifld, doc.taxPercent || 15);
        doc.items.forEach(it => { const row = document.querySelector(`tr[data-id="${it.id}"]`); if (row) updateRowCells(row, it, t, doc.taxPercent); });
      }
    } else if (numericFields.includes(ifld)) {
      calculateItem(item, doc.taxPercent || 15, ifld, t); updateRowCells(tr, item, t, doc.taxPercent);
    }
    refreshPreview(); return true;
  }

  formPanels.addEventListener('input', (e) => {
    if (e.target.classList && e.target.classList.contains('note-input')) {
      const row = e.target.closest('.note-row'); if (!row) return;
      const note = doc.notesList.find(n => n.id === row.dataset.noteId);
      if (note) { note.text = e.target.value; refreshPreview(); }
      return;
    }
    handleFieldChange(e.target);
  });
  formPanels.addEventListener('blur', (e) => {
    if (e.target.classList && e.target.classList.contains('note-input')) return;
    if (e.target.dataset.if || e.target.dataset.f) handleFieldChange(e.target);
  }, true);

  formPanels.addEventListener('click', async (e) => {
    if (e.target.id === 'add-note-btn') {
      doc.notesList.push({ id: uid(), text: '' });
      const editor = document.getElementById('notes-editor'); const addBtn = document.getElementById('add-note-btn');
      const last = doc.notesList[doc.notesList.length - 1];
      addBtn.insertAdjacentHTML('beforebegin', noteRowHTML(last));
      const inputs = editor.querySelectorAll('.note-input'); if (inputs.length) inputs[inputs.length - 1].focus();
      refreshPreview(); playSound('click'); return;
    }
    const rmNoteId = e.target.dataset.rmNote;
    if (rmNoteId) {
      doc.notesList = doc.notesList.filter(n => n.id !== rmNoteId);
      const row = e.target.closest('.note-row'); if (row) row.remove();
      refreshPreview(); playSound('click'); return;
    }
    if (e.target.id === 'add-row') {
      doc.items.push(emptyItem(t));
      document.getElementById('items-body').innerHTML = doc.items.map((it, i) => itemRow(it, i, t, doc.taxPercent)).join('');
      refreshPreview(); playSound('click'); return;
    }
    const rmId = e.target.dataset.rm;
    if (rmId) {
      doc.items = doc.items.filter(x => x.id !== rmId); if (!doc.items.length) doc.items.push(emptyItem(t));
      document.getElementById('items-body').innerHTML = doc.items.map((it, i) => itemRow(it, i, t, doc.taxPercent)).join('');
      refreshPreview(); playSound('click'); return;
    }
    if (e.target.id === 'save-doc') {
      startProgress(3000); const ok = await persistDoc(doc); finishProgress();
      if (ok) { window._currentDoc = null; showSuccessCheck('تم حفظ المستند', 1800); setTimeout(() => navigate('archive'), 700); }
    }
    if (e.target.id === 'save-print') {
      startProgress(3000); const ok = await persistDoc(doc); finishProgress();
      if (ok) { window._currentDoc = null; showSuccessCheck('تم الحفظ', 1500); setTimeout(() => navigate('view', { id: doc.id }), 900); }
    }
    if (e.target.id === 'cancel-form') navigate('dashboard');
    if (e.target.id === 'download-pdf-form') {
      refreshPreview();
      setTimeout(() => { const element = document.querySelector('#preview .doc-sheet'); exportPdf(element, doc.number + ' - ' + (doc.customerName || doc.receivedFrom || 'مستند')); }, 300);
    }
  });

  const taxInput = formPanels.querySelector('[data-f="taxPercent"]');
  if (taxInput) taxInput.addEventListener('change', function() {
    doc.taxPercent = safeNumber(this.value);
    if (t.isConcreteFull) { doc.items.forEach(item => { if (safeNumber(item.priceWithoutTaxOPC) > 0) recalcConcreteFull(doc, item, 'priceWithoutTaxOPC', doc.taxPercent); else if (safeNumber(item.priceWithTaxOPC) > 0) recalcConcreteFull(doc, item, 'priceWithTaxOPC', doc.taxPercent); }); }
    else { doc.items.forEach(item => { if (t.isPrecast) calculateItem(item, doc.taxPercent, 'unitPriceWithoutTax', t); else calculateItem(item, doc.taxPercent, 'price', t); }); }
    document.getElementById('items-body').innerHTML = doc.items.map((it, i) => itemRow(it, i, t, doc.taxPercent)).join('');
    refreshPreview();
  });
}

async function persistDoc(doc) {
  const isNew = !DOCS.find(d => d.id === doc.id);
  if (isNew) {
    let committedNum;
    try { committedNum = await commitDocNumber(); }
    catch (error) { return false; }
    doc.number = 'Q-' + SETTINGS.year + '-' + String(committedNum).padStart(3, '0');
  }
  doc.updatedAt = Date.now(); doc.updatedBy = CURRENT_USER.id; doc.updatedByName = CURRENT_USER.name;
  if (!doc.createdBy) { doc.createdBy = CURRENT_USER.id; doc.createdByName = CURRENT_USER.name; }
  doc.notesList = (doc.notesList || []).filter(n => n && n.text && n.text.trim());
  doc.notes = notesToLegacyString(doc.notesList);
  if (doc.showTotal === undefined) doc.showTotal = true;
  if (doc.showNumber === undefined) doc.showNumber = true;
  if (doc.showBank === undefined) doc.showBank = true;
  const ok = await saveDoc(doc); if (!ok) return false;
  await logActivity(isNew ? 'create' : 'update', `${isNew ? 'أنشأ' : 'عدّل'} ${TYPES[doc.type].title} ${doc.number}`, { entityType: doc.type, entityId: doc.id, entityNumber: doc.number });
  if (TYPES[doc.type] && TYPES[doc.type].kind === 'quote') {
    const isCash = doc.paymentMethod === 'نقدي';
    const existingReceipt = DOCS.find(d => d.type === 'receipt' && d.linkedQuoteId === doc.id);
    if (isCash && !existingReceipt) await createAutoReceipt(doc);
    else if (isCash && existingReceipt) {
      const totals = computeTotals(doc);
      existingReceipt.receivedFrom = doc.customerName || ''; existingReceipt.amount = totals.grand;
      existingReceipt.amountFor = doc.workDescription || ('دفعة عن عرض سعر ' + doc.number);
      existingReceipt.payerName = doc.customerName || '';
      if (existingReceipt.showTotal === undefined) existingReceipt.showTotal = true;
      if (existingReceipt.showNumber === undefined) existingReceipt.showNumber = true;
      if (existingReceipt.showBank === undefined) existingReceipt.showBank = true;
      await saveDoc(existingReceipt);
    } else if (!isCash && existingReceipt) await deleteDoc(existingReceipt.id);
  }
  return true;
}

async function createAutoReceipt(quoteDoc) {
  const totals = computeTotals(quoteDoc);
  const receipt = { id: uid(), type: 'receipt', number: quoteDoc.number, createdAt: Date.now(), createdBy: CURRENT_USER.id, createdByName: CURRENT_USER.name, status: 'approved', date: quoteDoc.date, showNumber: true, showTotal: true, showBank: true, receivedFrom: quoteDoc.customerName || '', amount: totals.grand, amountFor: quoteDoc.workDescription || ('دفعة عن عرض سعر ' + quoteDoc.number), paymentMethod: 'نقدي', txnRef: '', bankName: '', notesList: [], receiverName: SETTINGS.companyLine1 || 'صروح الثبات', receiverDate: quoteDoc.date, payerName: quoteDoc.customerName || '', payerDate: quoteDoc.date, linkedQuoteNumber: quoteDoc.number, linkedQuoteId: quoteDoc.id };
  await saveDoc(receipt); return receipt;
}

function buildExecutionDetails(doc) {
  const t = TYPES[doc.type]; if (!t) return '';
  const items = (doc.items || []).filter(it => it && (it.desc || it.code || safeNumber(it.qty) > 0));
  if (!items.length) return doc.materialType || doc.workDescription || '—';
  if (t.isConcreteFull) return items.map(it => `رمز: ${it.code || '—'} - أسمنت: ${it.cementContent || '—'}`).join(' + ');
  if (t.isBlock) return items.map(it => `${safeNumber(it.qty) || 0} ${it.size || ''} ${it.desc || ''}`.trim()).join(' + ');
  return items.map(it => `${safeNumber(it.qty) || 0} ${it.unit || ''} ${it.desc || ''}`.trim()).join(' + ');
}

  if (mode === 'edit') {
    ['exec-details', 'exec-pump', 'exec-address', 'exec-time', 'exec-notes', 'exec-followup'].forEach(id => { const el = document.getElementById(id); if (el) { el.addEventListener('input', () => { collect(); refreshExecPreview(); }); el.addEventListener('change', () => { collect(); refreshExecPreview(); }); } });
    document.getElementById('exec-save').onclick = async () => { collect(); doc.executionOrder = { ...exec, updatedAt: Date.now() }; startProgress(3000); const ok = await saveDoc(doc); finishProgress(); if (ok) { await logActivity('update', `حفظ أمر تنفيذ ${doc.number}`, { entityType: 'quote', entityId: doc.id, entityNumber: doc.number }); showSuccessCheck('تم حفظ أمر التنفيذ', 1800); setTimeout(() => navigate('execution', { id: doc.id, mode: 'view' }), 700); } };
    document.getElementById('exec-copy').onclick = () => { collect(); copyExecutionText(doc, exec); };
    document.getElementById('exec-pdf').onclick = function() { collect(); refreshExecPreview(); setTimeout(() => { const element = document.querySelector('#execution-preview .exec-sheet'); exportPdf(element, 'أمر تنفيذ - ' + doc.number); }, 300); };
    document.getElementById('exec-back').onclick = () => navigate('view', { id: doc.id });
  } else {
    document.getElementById('exec-pdf').onclick = function() { const element = document.querySelector('#print-area .exec-sheet'); exportPdf(element, 'أمر تنفيذ - ' + doc.number); };
    document.getElementById('exec-print').onclick = () => window.print();
    document.getElementById('exec-edit').onclick = () => navigate('execution', { id: doc.id, mode: 'edit' });
    document.getElementById('exec-copy').onclick = () => copyExecutionText(doc, exec);
    document.getElementById('exec-back').onclick = () => navigate('view', { id: doc.id });
  }
}
function executionText(doc, exec) { return ['📋 أمر تنفيذ طلب', '', `👤 اسم العميل: ${doc.customerName || '—'}`, `📞 رقم هاتف المسؤول: ${doc.contact || '—'}`, `📦 تفاصيل الطلب: ${exec.details || '—'}`, `🏗️ المضخة: ${exec.pump || 'لا'}`, `📍 عنوان التسليم: ${exec.deliveryAddress || '—'}`, `🕒 موعد التسليم: ${exec.deliveryTime || '—'}`, `📝 ملاحظات: ${exec.executionNotes || '—'}`, `👷 مسؤول المتابعة: ${exec.followupPerson || '—'}`].join('\n'); }
function copyExecutionText(doc, exec) {
  const text = executionText(doc, exec);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => showSuccessCheck('تم نسخ النص', 1200)).catch(() => fallbackCopy(text));
  else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showSuccessCheck('تم نسخ النص', 1200); } catch (e) { toast('❌ فشل', 'error'); }
  document.body.removeChild(ta);
}

async function init() {
  initTheme(); startProgress(5000);
  try { await Promise.race([Promise.all([loadSettings(), loadDocs(), loadEmployees(), loadActivity()]), new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 10000))]); } catch (e) {}
  finishProgress();
  document.getElementById('loading-screen').classList.add('hidden');
  const savedUser = loadSession();
  if (savedUser) {
    const emp = EMPLOYEES.find(e => e.id === savedUser.id);
    if (emp && emp.active !== false) {
      CURRENT_USER = { id: emp.id, name: emp.name, phone: emp.phone, code: emp.code, role: 'employee', photoURL: emp.photoURL || savedUser.photoURL || '' };
      saveSession(CURRENT_USER); enterApp(); return;
    } else clearSession();
  }
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('emp-code')?.addEventListener('keypress', e => { if (e.key === 'Enter') doEmployeeLogin(); });
  document.getElementById('emp-code')?.addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, ''); });
}

init();
</script>
